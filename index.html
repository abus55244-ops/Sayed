          {/* ৪টি উপাদানের বার */}
          {detail.breakdown.map(({label,value,weight,color})=>(
            <div key={label} style={{marginBottom:6}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
                <span>{label} <span style={{color:C.mu}}>({weight}%)</span></span>
                <span style={{fontWeight:700,color}}>{value}/100</span>
              </div>
              <div style={{height:6,background:"#eee",borderRadius:3}}>
                <div style={{width:`${value}%`,height:"100%",background:color,borderRadius:3}}/>
              </div>
            </div>
          ))}
        </Card>

        {/* বিষয়ভিত্তিক পারফরম্যান্স */}
        {subjectPerf.length>0&&(<Card>
          <H3>বিষয়ভিত্তিক পারফরম্যান্স</H3>
          <table><thead><tr><th>বিষয়</th><th>গড়</th><th>পাস</th><th>ফেল</th></tr></thead><tbody>
            {subjectPerf.map(({sub,avg,pass,fail})=>{const[,gc]=getGrade(avg);return(<tr key={sub}><td style={{fontWeight:600}}>{sub}</td><td style={{fontWeight:700,color:gc}}>{avg}</td><td style={{color:C.gr,fontWeight:600}}>{pass}</td><td style={{color:C.re,fontWeight:600}}>{fail}</td></tr>);})}
          </tbody></table>
        </Card>)}

        {/* ছাত্রভিত্তিক উন্নতি */}
        {studentImprovements.length>0&&(<Card>
          <H3>ছাত্রভিত্তিক উন্নতি (KPI ভিত্তি)</H3>
          <table><thead><tr><th>ছাত্র</th><th>বিষয়</th><th>শুরু</th><th>শেষ</th><th>উন্নতি</th><th>ক্রেডিট</th></tr></thead><tbody>
            {studentImprovements.map(({name,subject,first,last,imp},i)=>{
              const credit=first<33&&imp>0?"সর্বোচ্চ":first<50&&imp>0?"বেশি":first<70&&imp>0?"মাঝারি":"কম";
              const cc=credit==="সর্বোচ্চ"?C.gr:credit==="বেশি"?C.te:credit==="মাঝারি"?C.am:C.mu;
              return(<tr key={i}><td style={{fontSize:11,fontWeight:500}}>{name}</td><td style={{fontSize:11}}>{subject}</td><td style={{color:C.co,fontWeight:600}}>{first}</td><td style={{color:C.gr,fontWeight:600}}>{last}</td><td>{badge(imp>0?C.gr:C.re,`${imp>0?"+":""}${imp}`)}</td><td>{badge(cc,credit)}</td></tr>);
            })}
          </tbody></table>
        </Card>)}

        {studentImprovements.length===0&&detail.count===0&&(<Card><div style={{textAlign:"center",color:C.mu,padding:20,fontSize:13}}>এই শিক্ষকের কোনো ফলাফল এন্ট্রি নেই।<br/><span style={{fontSize:11}}>পরীক্ষা মডিউলে শিক্ষক নির্বাচন করে ফলাফল দিন।</span></div></Card>)}
      </div>)}

      {!selTeacher&&(<Card><div style={{textAlign:"center",color:C.mu,padding:30,fontSize:13}}>উপরে একজন শিক্ষক বেছে নিন<br/><span style={{fontSize:11}}>বিস্তারিত KPI রিপোর্ট দেখতে পাবেন</span></div></Card>)}
    </div>)}
  </div>);
}

/* ══ ARCHITECTURE ══ */
function Architecture(){
  const modules=[{name:"M1 — ছাত্র ব্যবস্থাপনা",desc:"১০২+ শিক্ষার্থীর প্রোফাইল",color:C.pu},{name:"M2 — শিক্ষক ব্যবস্থাপনা",desc:"২০ জন শিক্ষকের তথ্য",color:C.pu},{name:"M3 — পরীক্ষা ব্যবস্থাপনা",desc:"চার ধরনের পরীক্ষা",color:C.pu},{name:"M4 — পাঠ পরিকল্পনা",desc:"সাপ্তাহিক পাঠ ট্র্যাকিং",color:C.co},{name:"M5 — শিক্ষক পর্যবেক্ষণ",desc:"উপস্থিতি, পরিদর্শন, সিলেবাস, প্রশিক্ষণ, ফিডব্যাক",color:C.co},{name:"M6 — শিক্ষক KPI",desc:"বহুমাত্রিক স্কোরিং সিস্টেম",color:C.co},{name:"M7 — ছাত্র প্রবৃদ্ধি",desc:"গ্রোথ চার্ট ও ট্র্যাকিং",color:C.am},{name:"M8 — একাডেমিক ড্যাশবোর্ড",desc:"শ্রেণিভিত্তিক বিশ্লেষণ",color:C.am}];
  return(<div>
    <H2>🏛 সিস্টেম আর্কিটেকচার</H2>
    <Card style={{background:C.puL,border:`1px solid ${C.pu}30`}}><div style={{fontWeight:700,color:C.pu,fontSize:15}}>Heritage Academic Intelligence System</div><div style={{fontSize:12,marginTop:4,color:C.mu}}>HAIS v3.0 • React Web App • ৩ স্তর • ৮ মডিউল</div></Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
      {modules.map((m,i)=>(<div key={i} style={{background:C.cd,border:`1px solid ${C.bd}`,borderLeft:`4px solid ${m.color}`,borderRadius:10,padding:"11px 11px 11px 13px"}}><div style={{fontWeight:700,fontSize:12,color:m.color}}>{m.name}</div><div style={{fontSize:11,color:C.mu,marginTop:2}}>{m.desc}</div></div>))}
    </div>
    <Card style={{background:C.reL,border:`1px solid ${C.re}30`}}><div style={{fontWeight:700,color:C.re,marginBottom:4}}>★ বিশেষ KPI নিয়ম</div><div style={{fontSize:12}}>দুর্বল ছাত্রের উন্নতিকে সর্বোচ্চ গুরুত্ব দেওয়া হয়</div></Card>
  </div>);
}

/* ══ APP ROOT ══ */
const PAGES=[{id:"dashboard",label:"📊 ড্যাশবোর্ড"},{id:"students",label:"👨‍🎓 ছাত্র"},{id:"teachers",label:"👩‍🏫 শিক্ষক"},{id:"exam",label:"📝 পরীক্ষা"},{id:"results",label:"📋 ফলাফল"},{id:"lesson",label:"📚 পাঠ পরিকল্পনা"},{id:"observe",label:"👁 পর্যবেক্ষণ"},{id:"kpi",label:"⭐ KPI"},{id:"manage",label:"⚙️ তালিকা"},{id:"arch",label:"🏛 আর্কিটেকচার"}];

function App(){
  const [page,setPage]=useState("dashboard");
  const [results,setResults]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw).results||{};}catch(e){console.error("HAIS লোড সমস্যা:",e);}
    return{};
  });
  const [lessonPlans,setLessonPlans]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw).lessonPlans||{};}catch(e){console.error("HAIS লোড সমস্যা:",e);}
    return{};
  });
  const [obsData,setObsData]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw).obsData||{};}catch(e){console.error("HAIS লোড সমস্যা:",e);}
    return{};
  });
  const [students,setStudentsState]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d.students)return d.students;}}catch(e){}
    return DEFAULT_STUDENTS;
  });
  const [teachers,setTeachersState]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw){const d=JSON.parse(raw);if(d.teachers)return d.teachers;}}catch(e){}
    return DEFAULT_TEACHERS;
  });
  // sync globals so all child components see updated lists
  STUDENTS=students;
  TEACHERS=teachers;

  const setStudents=(fn)=>{setStudentsState(fn);};
  const setTeachers=(fn)=>{setTeachersState(fn);};
  const [lastSaved,setLastSaved]=useState(null);
  const [saveError,setSaveError]=useState(false);
  const [importMsg,setImportMsg]=useState("");
  const [showExportMenu,setShowExportMenu]=useState(false);
  const [lpRole,setLpRole]=useState(()=>{
    try{const raw=localStorage.getItem(LS_KEY);if(raw)return JSON.parse(raw).lpRole||LP_ROLES.ADMIN;}catch(e){}
    return LP_ROLES.ADMIN;
  });
  const [showSearch,setShowSearch]=useState(false);
  const [searchQ,setSearchQ]=useState("");
  const [searchProfile,setSearchProfile]=useState(null);
  const [searchType,setSearchType]=useState(null);

  // ফলাফল বা পাঠ পরিকল্পনা পরিবর্তন হলেই স্বয়ংক্রিয়ভাবে ডিভাইসে সংরক্ষণ
  useEffect(()=>{
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({results,lessonPlans,obsData,lpRole,students,teachers,savedAt:new Date().toISOString()}));
      setLastSaved(new Date());
      setSaveError(false);
    }catch(e){
      console.error("HAIS সংরক্ষণ সমস্যা:",e);
      setSaveError(true);
    }
  },[results,lessonPlans,obsData,lpRole,students,teachers]);

  const allStudents=Object.entries(students).flatMap(([cls,names])=>names.map(n=>({name:n,cls})));
  const searchResults=useMemo(()=>{
    if(searchQ.trim().length<2)return[];
    const q=searchQ.toLowerCase();
    const studs=allStudents.filter(s=>s.name.toLowerCase().includes(q)).map(s=>({...s,type:"student"}));
    const tchs=teachers.filter(t=>t.toLowerCase().includes(q)).map(t=>({name:t,type:"teacher"}));
    return[...studs,...tchs].slice(0,8);
  },[searchQ,allStudents,teachers]);

  const exportJSON=()=>{
    const a=document.createElement("a");
    a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify({results,lessonPlans,obsData,students,teachers,exportedAt:new Date().toISOString()},null,2));
    a.download=`HAIS_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();
    try{localStorage.setItem(LS_EXPORT_KEY,new Date().toISOString());}catch(e){}
    setShowExportMenu(false);
  };

  const importJSON=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d||(!d.results&&!d.lessonPlans)){
          setImportMsg("✗ এটি সঠিক HAIS ব্যাকআপ ফাইল নয়।");
          setTimeout(()=>setImportMsg(""),3500);
          return;
        }
        if(!window.confirm("এই ব্যাকআপ ফাইল থেকে পুনরুদ্ধার করলে বর্তমান সব ডেটা প্রতিস্থাপিত হবে। আপনি কি নিশ্চিত?"))return;
        setResults(d.results||{});
        setLessonPlans(d.lessonPlans||{});
        setObsData(d.obsData||{});
        if(d.lpRole)setLpRole(d.lpRole);
        if(d.students)setStudents(()=>d.students);
        if(d.teachers)setTeachers(()=>d.teachers);
        setImportMsg("✓ ডেটা সফলভাবে পুনরুদ্ধার করা হয়েছে!");
        setTimeout(()=>setImportMsg(""),3500);
      }catch(err){
        setImportMsg("✗ ফাইলটি পড়া যায়নি। সঠিক JSON ব্যাকআপ ফাইল কিনা যাচাই করুন।");
        setTimeout(()=>setImportMsg(""),3500);
      }
    };
    reader.readAsText(file);
    e.target.value="";
    setShowExportMenu(false);
  };

  const printReport=()=>{
    const allRes=Object.values(results).flat();
    const total=Object.values(STUDENTS).flat().length;
    const avg=allRes.length?Math.round(allRes.reduce((a,b)=>a+b.marks,0)/allRes.length):0;
    const pass=allRes.filter(r=>r.marks>=(r.passMarks||33)).length;
    const clsRows=Object.keys(STUDENTS).map(cls=>{
      const cr=allRes.filter(r=>r.cls===cls);
      if(!cr.length)return`<tr><td>শ্রেণি ${cls}</td><td>${STUDENTS[cls].length}</td><td>—</td><td>—</td><td>—</td></tr>`;
      const cavg=Math.round(cr.reduce((a,b)=>a+b.marks,0)/cr.length);
      const cp=cr.filter(r=>r.marks>=(r.passMarks||33)).length;
      return`<tr><td>শ্রেণি ${cls}</td><td>${STUDENTS[cls].length}</td><td>${cavg}</td><td>${cp}</td><td>${cr.length-cp}</td></tr>`;
    }).join("");
    const w=window.open("","_blank");
    w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HAIS রিপোর্ট</title>
    <style>body{font-family:sans-serif;padding:24px;color:#1a1a2e}h1{color:#5344b5;border-bottom:2px solid #5344b5;padding-bottom:8px}h2{color:#5344b5;margin-top:20px;font-size:15px}table{width:100%;border-collapse:collapse;margin-top:8px}th{background:#ede9fd;color:#5344b5;padding:8px;text-align:left;font-size:13px}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:13px}.stat{display:inline-block;background:#f0eeff;border:1px solid #c0b8f0;border-radius:8px;padding:8px 16px;margin:4px;text-align:center}.stat b{display:block;font-size:22px;color:#5344b5}.footer{margin-top:30px;color:#999;font-size:11px;text-align:center}@media print{button{display:none}}</style></head>
    <body>
    <h1>🏫 Heritage Academic Intelligence System</h1>
    <p style="color:#666;font-size:13px">Heritage Public School &nbsp;|&nbsp; রিপোর্ট তারিখ: ${new Date().toLocaleDateString("bn-BD")}</p>
    <div style="margin:16px 0">
      <div class="stat"><b>${total}</b>মোট শিক্ষার্থী</div>
      <div class="stat"><b>${TEACHERS.length}</b>মোট শিক্ষক</div>
      <div class="stat"><b>${allRes.length?avg:"—"}</b>গড় নম্বর</div>
      <div class="stat"><b>${allRes.length?Math.round(pass/allRes.length*100)+"%":"—"}</b>পাস রেট</div>
    </div>
    <h2>শ্রেণিভিত্তিক সারসংক্ষেপ</h2>
    <table><thead><tr><th>শ্রেণি</th><th>শিক্ষার্থী</th><th>গড় নম্বর</th><th>পাস</th><th>ফেল</th></tr></thead><tbody>${clsRows}</tbody></table>
    <div class="footer">HAIS v3.0 — Heritage Public School — স্বয়ংক্রিয়ভাবে তৈরি রিপোর্ট</div>
    <br/><button onclick="window.print()" style="padding:8px 20px;background:#5344b5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">🖨️ প্রিন্ট করুন</button>
    </body></html>`);
    w.document.close();
    setShowExportMenu(false);
  };

  return(<div style={{minHeight:"100vh",background:C.bg,fontFamily:"sans-serif",color:C.tx}}>

    {/* গ্লোবাল সার্চ পপআপ */}
    {showSearch&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,padding:"60px 16px 16px"}} onClick={()=>{setShowSearch(false);setSearchQ("");}}>
        <div style={{background:"#fff",borderRadius:14,padding:14,maxWidth:420,margin:"0 auto"}} onClick={e=>e.stopPropagation()}>
          <input type="text" autoFocus placeholder="ছাত্র বা শিক্ষকের নাম লিখুন..." value={searchQ} onChange={e=>setSearchQ(e.target.value)}
            style={{width:"100%",padding:"10px 14px",border:`2px solid ${C.pu}`,borderRadius:10,fontSize:14,outline:"none",marginBottom:8}}/>
          {searchQ.length>=2&&searchResults.length===0&&(
            <div style={{textAlign:"center",color:C.mu,padding:12,fontSize:13}}>কোনো ফলাফল পাওয়া যায়নি</div>
          )}
          {searchResults.map((r,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,cursor:"pointer",background:i%2===0?"#f8f7ff":"#fff"}}
              onClick={()=>{setSearchProfile(r);setSearchType(r.type);setShowSearch(false);setSearchQ("");}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:r.type==="student"?C.puL:C.teL,color:r.type==="student"?C.pu:C.te,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,flexShrink:0}}>
                {r.name.split(" ").map(w=>w[0]).filter(Boolean).slice(0,2).join("")}
              </div>
              <div>
                <div style={{fontWeight:600,fontSize:13}}>{r.name}</div>
                <div style={{fontSize:11,color:C.mu}}>{r.type==="student"?`ছাত্র • শ্রেণি ${r.cls}`:"শিক্ষক"}</div>
              </div>
              {badge(r.type==="student"?C.pu:C.te,r.type==="student"?"ছাত্র":"শিক্ষক")}
            </div>
          ))}
        </div>
      </div>
    )}

    {/* সার্চ থেকে প্রোফাইল পপআপ */}
    {searchProfile&&searchType==="student"&&(
      <StudentProfile name={searchProfile.name} cls={searchProfile.cls} results={results} onClose={()=>setSearchProfile(null)}/>
    )}
    {searchProfile&&searchType==="teacher"&&(
      <TeacherProfile name={searchProfile.name} results={results} lessonPlans={lessonPlans} obsData={obsData} onClose={()=>setSearchProfile(null)}/>
    )}

    <div style={{background:C.pu,color:"#fff",padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px #5344b540"}}>
      <div><div style={{fontWeight:700,fontSize:15}}>🏫 HAIS</div><div style={{fontSize:10,opacity:0.8}}>Heritage Public School • v3.0</div></div>
      <div style={{display:"flex",gap:6,alignItems:"center"}}>
        <button onClick={()=>setShowSearch(true)} style={{padding:"5px 10px",borderRadius:8,border:"1px solid #ffffff50",background:"transparent",color:"#fff",cursor:"pointer",fontSize:13}}>🔍</button>
        <div style={{position:"relative"}}>
          <button onClick={()=>setShowExportMenu(p=>!p)} style={{padding:"5px 12px",borderRadius:8,border:"1px solid #ffffff50",background:"transparent",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:600}}>💾 ডেটা ▾</button>
          {showExportMenu&&(<div style={{position:"absolute",right:0,top:34,background:"#fff",borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",padding:6,minWidth:210,zIndex:200}}>
            <div style={{padding:"6px 12px",fontSize:10,color:saveError?C.re:C.gr,fontWeight:600}}>
              {saveError?"⚠ স্বয়ংক্রিয় সংরক্ষণ ব্যর্থ হয়েছে":lastSaved?`✓ স্বয়ংক্রিয়ভাবে সংরক্ষিত — ${lastSaved.toLocaleTimeString("bn-BD")}`:"সংরক্ষণ হচ্ছে..."}
            </div>
            <div style={{height:1,background:C.bd,margin:"4px 0"}}/>
            <button onClick={exportJSON} style={{display:"block",width:"100%",padding:"8px 12px",border:"none",background:"transparent",textAlign:"left",cursor:"pointer",fontSize:13,color:C.tx,borderRadius:6}}>⬇ ব্যাকআপ ফাইল ডাউনলোড</button>
            <label htmlFor="haisImportInput" style={{display:"block",width:"100%",padding:"8px 12px",border:"none",background:"transparent",textAlign:"left",cursor:"pointer",fontSize:13,color:C.tx,borderRadius:6}}>📥 ব্যাকআপ থেকে পুনরুদ্ধার</label>
            <input id="haisImportInput" type="file" accept="application/json,.json" style={{display:"none"}} onChange={importJSON}/>
            <button onClick={printReport} style={{display:"block",width:"100%",padding:"8px 12px",border:"none",background:"transparent",textAlign:"left",cursor:"pointer",fontSize:13,color:C.tx,borderRadius:6}}>🖨️ প্রিন্ট রিপোর্ট</button>
            {importMsg&&<div style={{padding:"6px 12px",fontSize:11,color:importMsg.startsWith("✓")?C.gr:C.re,fontWeight:600}}>{importMsg}</div>}
          </div>)}
        </div>
      </div>
    </div>
    <div style={{display:"flex",gap:4,overflowX:"auto",background:"#fff",padding:"8px 10px",borderBottom:`1px solid ${C.bd}`,WebkitOverflowScrolling:"touch"}}>
      {PAGES.map(p=>(<button key={p.id} onClick={()=>setPage(p.id)} style={{padding:"6px 10px",borderRadius:16,border:`1px solid ${page===p.id?C.pu:C.bd}`,background:page===p.id?C.puL:"transparent",color:page===p.id?C.pu:C.mu,cursor:"pointer",fontSize:11,fontWeight:page===p.id?700:400,whiteSpace:"nowrap",flexShrink:0}}>{p.label}</button>))}
    </div>
    <div style={{padding:"12px",maxWidth:700,margin:"0 auto"}}>
      {page==="dashboard"&&<Dashboard results={results} lessonPlans={lessonPlans} onExport={exportJSON}/>}
      {page==="students" &&<Students results={results}/>}
      {page==="teachers" &&<Teachers results={results} lessonPlans={lessonPlans} obsData={obsData}/>}
      {page==="exam"     &&<ExamEntry results={results} setResults={setResults}/>}
      {page==="results"  &&<Results results={results}/>}
      {page==="lesson"   &&<LessonPlans lessonPlans={lessonPlans} setLessonPlans={setLessonPlans} lpRole={lpRole} setLpRole={setLpRole}/>}
      {page==="observe"  &&<TeacherObservation obsData={obsData} setObsData={setObsData}/>}
      {page==="kpi"      &&<KPI results={results} lessonPlans={lessonPlans} obsData={obsData}/>}
      {page==="manage"   &&<Manage students={students} setStudents={setStudents} teachers={teachers} setTeachers={setTeachers}/>}
      {page==="arch"     &&<Architecture/>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
