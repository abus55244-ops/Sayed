<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F3B2C" />
<title>খেরোখাতা — ব্যক্তিগত সহায়ক</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<style>
:root{
  --green:#1F3B2C;
  --green-deep:#132A1D;
  --stone:#F2F1EC;
  --card:#FFFFFF;
  --gold:#B8863B;
  --gold-light:#D9B579;
  --brick:#A6432E;
  --sage:#5B7A63;
  --plum:#6B4A6E;
  --slate:#3E5C76;
  --ochre:#8C6D34;
  --ink:#1C1F1B;
  --muted:#6E7268;
  --line:#E1DED2;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,27,0.06), 0 1px 2px rgba(28,31,27,0.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:'Hind Siliguri', sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Tiro Bangla', serif; font-weight:400; }
button{font-family:inherit;}
::selection{background:var(--gold-light); color:var(--green-deep);}

#root{max-width:520px; margin:0 auto; min-height:100vh; background:var(--stone); position:relative; padding-bottom:88px;}

/* ---------- Header ---------- */
.app-header{
  background:linear-gradient(160deg, var(--green) 0%, var(--green-deep) 100%);
  color:var(--stone);
  padding:22px 20px 26px;
  border-bottom:3px solid var(--gold);
  position:relative;
  overflow:hidden;
}
.app-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background-image:repeating-linear-gradient(90deg, var(--gold) 0 8px, transparent 8px 16px);
  opacity:0.6;
}
.app-title{ font-size:22px; letter-spacing:0.5px; margin:0; color:#fff;}
.app-sub{ font-size:13px; color:var(--gold-light); margin-top:4px; opacity:0.9;}
.header-date{ font-size:13px; color:rgba(242,241,236,0.75); margin-top:14px;}
.header-greet{ font-size:17px; margin-top:2px; font-weight:600;}

/* ---------- Stitch divider (signature element) ---------- */
.stitch{
  height:1px;
  margin:18px 0;
  background-image:repeating-linear-gradient(90deg, var(--line) 0 7px, transparent 7px 14px);
}
.stitch.gold{ background-image:repeating-linear-gradient(90deg, var(--gold) 0 7px, transparent 7px 14px); opacity:0.7;}

/* ---------- Layout ---------- */
.page{ padding:18px 18px 6px; }
.section-title{
  font-size:15px; color:var(--muted); font-weight:600; margin:0 0 10px 2px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-title .tag{ font-size:11px; font-weight:600; color:var(--gold); background:rgba(184,134,59,0.12); padding:2px 8px; border-radius:20px;}

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin-bottom:12px;
  border:1px solid rgba(0,0,0,0.03);
}
.card.tab-accent{ border-left:4px solid var(--accent, var(--gold)); }

/* ---------- Dashboard hero ---------- */
.hero-card{
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px;
  margin:-18px 18px 18px;
  position:relative;
  border-top:3px solid var(--gold);
}
.hero-row{ display:flex; gap:10px; margin-top:10px;}
.hero-stat{ flex:1; text-align:center; padding:10px 4px; border-radius:10px; background:var(--stone);}
.hero-stat .num{ font-family:'Tiro Bangla',serif; font-size:22px; color:var(--green);}
.hero-stat .lbl{ font-size:11.5px; color:var(--muted); margin-top:2px;}

/* ---------- Checklist rows ---------- */
.row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
.row + .row{ border-top:1px dashed var(--line); }
.chk{
  width:22px; height:22px; border-radius:6px; border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  transition:all .15s ease;
}
.chk.done{ background:var(--sage); border-color:var(--sage); color:#fff; }
.row-title{ font-size:14.5px; flex:1; }
.row-title.done{ text-decoration:line-through; color:var(--muted); }
.row-meta{ font-size:11.5px; color:var(--muted); }
.pill{
  font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;
}

/* ---------- Bottom nav (ledger tabs) ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0;
  max-width:520px; margin:0 auto;
  background:var(--green-deep);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 12px rgba(0,0,0,0.18);
  z-index:50;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px 6px; border:none; background:none; cursor:pointer; position:relative;
  color:rgba(242,241,236,0.55); font-size:10.5px;
}
.tab .dot{ width:16px; height:4px; border-radius:3px; background:transparent; margin-bottom:1px; transition:all .15s;}
.tab.active{ color:#fff; }
.tab.active .dot{ background:var(--tabcolor, var(--gold)); width:22px; }
.tab svg{ width:20px; height:20px; }

/* ---------- Floating add button ---------- */
.fab{
  position:fixed; right:calc(18px + (100vw - 520px) / 2); bottom:82px;
  width:54px; height:54px; border-radius:50%;
  background:var(--gold); color:#fff; border:none; font-size:26px;
  box-shadow:0 4px 14px rgba(184,134,59,0.45);
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:45;
}
@media (max-width:520px){ .fab{ right:18px; } }

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(19,42,29,0.45); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
.sheet{
  background:var(--card); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  animation:slideUp .2s ease;
}
@keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
.sheet h2{ font-size:19px; margin:0 0 14px; color:var(--green-deep); }
.field{ margin-bottom:12px; }
.field label{ font-size:12.5px; color:var(--muted); display:block; margin-bottom:5px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:14.5px; background:var(--stone); color:var(--ink);
}
.field textarea{ min-height:70px; resize:vertical; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--gold-light); border-color:var(--gold); }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  padding:7px 13px; border-radius:20px; border:1.5px solid var(--line); background:var(--stone);
  font-size:13px; cursor:pointer; color:var(--muted);
}
.chip.sel{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, white); color:var(--accent); font-weight:600;}
.btn{
  width:100%; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:600;
  cursor:pointer; margin-top:6px;
}
.btn-primary{ background:var(--green); color:#fff; }
.btn-ghost{ background:none; color:var(--muted); }
.btn-danger{ background:none; color:var(--brick); font-size:13px; text-align:center; }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:34px 10px; color:var(--muted); }
.empty .glyph{ font-size:30px; margin-bottom:8px; opacity:.5; }
.empty .msg{ font-size:13.5px; }

/* ---------- Calendar ---------- */
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
.cal-dow{ text-align:center; font-size:11px; color:var(--muted); font-weight:600; padding-bottom:4px;}
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer; position:relative; background:var(--card); border:1px solid transparent; color:var(--ink);
}
.cal-day.muted{ color:var(--line); }
.cal-day.today{ border-color:var(--gold); font-weight:700; }
.cal-day.sel{ background:var(--green); color:#fff; }
.cal-day .marks{ display:flex; gap:2px; margin-top:3px; }
.cal-day .marks span{ width:5px; height:5px; border-radius:50%; }

/* ---------- Habit heat ---------- */
.habit-week{ display:flex; gap:5px; }
.hcell{ width:24px; height:24px; border-radius:6px; background:var(--stone); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); cursor:pointer;}
.hcell.on{ background:var(--sage); border-color:var(--sage); color:#fff; }

/* ---------- Goal progress ---------- */
.progress-track{ height:8px; background:var(--stone); border-radius:6px; overflow:hidden; margin-top:8px;}
.progress-fill{ height:100%; background:var(--plum); border-radius:6px; transition:width .3s ease; }

/* ---------- Expenses ---------- */
.exp-total{ font-family:'Tiro Bangla',serif; font-size:26px; color:var(--ochre); }
.exp-cat-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; margin:10px 0; }

/* ---------- Notes ---------- */
.note-card{ white-space:pre-wrap; font-size:13.5px; line-height:1.6; color:var(--ink); }
.note-date{ font-size:11px; color:var(--muted); margin-top:8px; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:150px; left:50%; transform:translateX(-50%);
  background:var(--green-deep); color:#fff; padding:10px 18px; border-radius:24px; font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25); z-index:200; animation:toastIn .2s ease;
}
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }

::-webkit-scrollbar{ width:0; height:0; }

.linked-tag{
  font-size:11px; padding:2px 8px; border-radius:20px; background:rgba(107,74,110,0.12); color:var(--plum); font-weight:600;
}
</style>
</head>
<body>
<div id="root">
  <div id="boot-fallback" style="max-width:520px;margin:60px auto;text-align:center;font-family:sans-serif;color:#6E7268;padding:0 20px;">
    <div style="font-size:14px;">অ্যাপ লোড হচ্ছে…</div>
    <div id="boot-error" style="margin-top:10px;font-size:12.5px;color:#A6432E;"></div>
  </div>
</div>
<script>
  window.addEventListener("error", function(e){
    var el = document.getElementById("boot-error");
    if(el) el.textContent = "লোড এরর: " + (e.message || (e.error && e.error.message) || "unknown");
  });
</script>

<script type="text/babel" data-presets="react,env">
const {useState, useEffect, useMemo, useRef, useCallback} = React;

/* ===================== Firebase (optional) ===================== */
/* এখানে আপনার নিজের Firebase কনফিগ বসান — না বসালে অ্যাপ localStorage-এ কাজ করবে */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDXGKBRLhuXxe9s1OPZvL94RlCJJaXDdWM",
  authDomain: "personal-3a780.firebaseapp.com",
  databaseURL: "https://personal-3a780-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "personal-3a780",
  storageBucket: "personal-3a780.firebasestorage.app",
  messagingSenderId: "876949145313",
  appId: "1:876949145313:web:42ab41ba44de214586d9a0"
};
let fbApp = null, fbDb = null;
function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function initFirebaseIfConfigured(){
  if(!FIREBASE_CONFIG) return;
  try{
    await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js");
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbDb = firebase.database();
  }catch(e){ console.warn("firebase init failed", e); }
}
const firebaseReadyPromise = initFirebaseIfConfigured();

/* ===================== Storage layer ===================== */
const STORE_KEY = "kherokhata_v1";
const DEFAULT_HABITS = [
  {id:"habit_salah", title:"পাঁচ ওয়াক্ত নামাজ"},
  {id:"habit_quran", title:"দৈনিক কুরআন তিলাওয়াত"},
  {id:"habit_shahitya", title:"দৈনিক সাহিত্য পাঠ"},
];
const DEFAULT_ACCOUNTS = [
  {id:"acc_cash", name:"ক্যাশ", openingBalance:0},
  {id:"acc_bank", name:"ব্যাংক", openingBalance:0},
  {id:"acc_mobile", name:"মোবাইল ব্যাংকিং", openingBalance:0},
];
function freshState(){
  return { tasks:[], events:[], habits:[...DEFAULT_HABITS], habitLogs:{}, goals:[], notes:[],
           accounts:[...DEFAULT_ACCOUNTS], transactions:[], budgets:{} };
}
function migrateState(s){
  // upgrade older saves that only had a flat `expenses` array
  if(!s.accounts) s.accounts = [...DEFAULT_ACCOUNTS];
  if(!s.budgets) s.budgets = {};
  if(!s.transactions){
    s.transactions = (s.expenses||[]).map(e=>({
      id:e.id, type:"expense", amount:Number(e.amount||0), category:e.category||"other",
      accountId: s.accounts[0].id, note:e.note||"", date:e.date
    }));
  }
  delete s.expenses;
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){}
  return freshState();
}
function saveState(state){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  if(fbDb){ try{ fbDb.ref("kherokhata").set(state); }catch(e){} }
}

/* ===================== Date helpers ===================== */
const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function toBn(n){ return String(n).split("").map(c => /[0-9]/.test(c) ? BN_DIGITS[+c] : c).join(""); }
const BN_MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const BN_DAYS = ["রবি","সোম","মঙ্গল","বুধ","বৃহস্পতি","শুক্র","শনি"];
const BN_DAYS_SHORT = ["র","সো","ম","বু","বৃ","শু","শ"];
function fmtDate(d){
  const dt = new Date(d);
  return `${toBn(dt.getDate())} ${BN_MONTHS[dt.getMonth()]}, ${toBn(dt.getFullYear())}`;
}
function isoDate(d){ const dt=new Date(d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function todayIso(){ return isoDate(new Date()); }
function greeting(){
  const h = new Date().getHours();
  if(h<12) return "শুভ সকাল";
  if(h<16) return "শুভ দুপুর";
  if(h<19) return "শুভ বিকাল";
  return "শুভ সন্ধ্যা";
}

/* ===================== Notifications ===================== */
function ensureNotifPermission(){
  if("Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
}
function checkDueReminders(state){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const now = new Date();
  const nowIso = todayIso();
  const key = "kherokhata_notified_" + nowIso;
  let notified = {};
  try{ notified = JSON.parse(sessionStorage.getItem(key) || "{}"); }catch(e){}
  state.tasks.forEach(t=>{
    if(t.done || !t.dueDate || !t.dueTime) return;
    if(t.dueDate !== nowIso) return;
    const due = new Date(t.dueDate+"T"+t.dueTime);
    const diffMin = (due - now)/60000;
    if(diffMin <= 0 && diffMin > -5 && !notified["task_"+t.id]){
      new Notification("খেরোখাতা · টাস্ক", { body: t.title, icon:"icon-192.png" });
      notified["task_"+t.id] = true;
    }
  });
  try{ sessionStorage.setItem(key, JSON.stringify(notified)); }catch(e){}
}

/* ===================== Small UI atoms ===================== */
function Chk({checked, onClick, accent}){
  return (
    <div className={"chk"+(checked?" done":"")} onClick={onClick} style={checked?{background:accent||"var(--sage)", borderColor:accent||"var(--sage)"}:{}}>
      {checked ? "✓" : ""}
    </div>
  );
}
function Empty({glyph, msg}){
  return <div className="empty"><div className="glyph">{glyph}</div><div className="msg">{msg}</div></div>;
}
function Toast({text}){
  if(!text) return null;
  return <div className="toast">{text}</div>;
}

/* ===================== Modal / Bottom sheet ===================== */
function Sheet({title, onClose, children}){
  return (
    <div className="overlay" onClick={(e)=>{ if(e.target.classList.contains("overlay")) onClose(); }}>
      <div className="sheet">
        <h2>{title}</h2>
        {children}
      </div>
    </div>
  );
}

/* ===================== Icons (inline svg, minimal) ===================== */
const Ic = {
  home: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg>,
  task: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>,
  cal: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.5h16M8 3v3M16 3v3"/></svg>,
  habit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/><circle cx="12" cy="12" r="3.2"/></svg>,
  goal: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>,
  note: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M6 3h9l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h6"/></svg>,
  exp: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></svg>,
};
const MODULES = [
  {key:"dashboard", label:"আজ", icon:Ic.home, color:"var(--gold)"},
  {key:"tasks", label:"টাস্ক", icon:Ic.task, color:"var(--brick)"},
  {key:"calendar", label:"ক্যালেন্ডার", icon:Ic.cal, color:"var(--gold)"},
  {key:"habits", label:"অভ্যাস", icon:Ic.habit, color:"var(--sage)"},
  {key:"goals", label:"গোল", icon:Ic.goal, color:"var(--plum)"},
  {key:"notes", label:"নোট", icon:Ic.note, color:"var(--slate)"},
  {key:"expenses", label:"হিসাব", icon:Ic.exp, color:"var(--ochre)"},
];

/* ===================== App ===================== */
function App(){
  const [state, setState] = useState(loadState);
  const [tab, setTab] = useState("dashboard");
  const [modal, setModal] = useState(null); // {type:"task"|"event"|"habit"|"goal"|"note"|"expense", data?}
  const [toast, setToast] = useState("");
  const [selectedDate, setSelectedDate] = useState(todayIso());

  useEffect(()=>{ saveState(state); }, [state]);
  useEffect(()=>{
    let ref = null;
    firebaseReadyPromise.then(()=>{
      if(!fbDb) return;
      ref = fbDb.ref("kherokhata");
      ref.on("value", (snap)=>{
        const val = snap.val();
        if(val) setState(migrateState(val));
      });
    });
    return ()=>{ if(ref) ref.off("value"); };
  }, []);
  useEffect(()=>{
    ensureNotifPermission();
    const iv = setInterval(()=>checkDueReminders(state), 60000);
    checkDueReminders(state);
    return ()=>clearInterval(iv);
  }, [state]);
  useEffect(()=>{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    }
  }, []);
  useEffect(()=>{
    if(!toast) return;
    const t = setTimeout(()=>setToast(""), 2200);
    return ()=>clearTimeout(t);
  }, [toast]);

  const showToast = (msg)=> setToast(msg);

  /* ---- generic CRUD helpers ---- */
  const addItem = (col, item)=> setState(s=>({...s, [col]:[...s[col], item]}));
  const updateItem = (col, id, patch)=> setState(s=>({...s, [col]: s[col].map(x=>x.id===id?{...x,...patch}:x)}));
  const removeItem = (col, id)=> setState(s=>({...s, [col]: s[col].filter(x=>x.id!==id)}));
  const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const toggleHabit = (habitId, iso)=> setState(s=>{
    const logs = {...s.habitLogs};
    const dayLog = {...(logs[iso]||{})};
    dayLog[habitId] = !dayLog[habitId];
    logs[iso] = dayLog;
    return {...s, habitLogs:logs};
  });

  /* ---- derived ---- */

  const openAdd = (type)=> setModal({type, data:null});
  const openEdit = (type, data)=> setModal({type, data});
  const closeModal = ()=> setModal(null);

  const fabAction = ()=>{
    const map = {dashboard:"task", tasks:"task", calendar:"event", habits:"habit", goals:"goal", notes:"note", expenses:"transaction"};
    openAdd(map[tab] || "task");
  };

  return (
    <React.Fragment>
      <Header state={state} />
      <div className="page" style={{paddingTop: tab==="dashboard" ? 0 : 4}}>
        {tab==="dashboard" && <Dashboard state={state} updateItem={updateItem} toggleHabit={toggleHabit} setTab={setTab} openAdd={openAdd} showToast={showToast} />}
        {tab==="tasks" && <TasksView state={state} updateItem={updateItem} removeItem={removeItem} openAdd={openAdd} openEdit={openEdit} />}
        {tab==="calendar" && <CalendarView state={state} selectedDate={selectedDate} setSelectedDate={setSelectedDate} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} />}
        {tab==="habits" && <HabitsView state={state} updateItem={updateItem} setState={setState} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} />}
        {tab==="goals" && <GoalsView state={state} updateItem={updateItem} removeItem={removeItem} openAdd={openAdd} openEdit={openEdit} />}
        {tab==="notes" && <NotesView state={state} openAdd={openAdd} openEdit={openEdit} removeItem={removeItem} />}
        {tab==="expenses" && <MoneyView state={state} setState={setState} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} openAdd={openAdd} openEdit={openEdit} />}
      </div>

      <button className="fab" onClick={fabAction} aria-label="নতুন যোগ করুন">+</button>

      <nav className="tabbar">
        {MODULES.map(m=>(
          <button key={m.key} className={"tab"+(tab===m.key?" active":"")} style={{"--tabcolor":m.color}} onClick={()=>setTab(m.key)}>
            <span className="dot"></span>
            {m.icon}
            <span>{m.label}</span>
          </button>
        ))}
      </nav>

      {modal && (
        <ModalRouter
          modal={modal} state={state}
          addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid}
          onClose={closeModal} showToast={showToast}
        />
      )}
      <Toast text={toast} />
    </React.Fragment>
  );
}

          </div>

    .sort((a,b)=> (a.dueDate||"9999").localeCompare(b.dueDate||"9999"));

      <div className="chip-row" style={{marginBottom:14}}>

/* ===================== Calendar ===================== */
function CalendarView({state, selectedDate, setSelectedDate, openAdd, openEdit, removeItem}){
  const [cursor, setCursor] = useState(()=>{ const d=new Date(); d.setDate(1); return d; });
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const itemsFor = (iso)=>({
    tasks: state.tasks.filter(t=>t.dueDate===iso),
    events: state.events.filter(e=>e.date===iso),
  });
  const dayItems = itemsFor(selectedDate);

  return (
    <React.Fragment>
      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10}}>
          <button className="btn-ghost" style={{width:"auto", padding:"4px 10px"}} onClick={()=>setCursor(new Date(year, month-1, 1))}>‹</button>
          <div style={{fontWeight:700}}>{BN_MONTHS[month]} {toBn(year)}</div>
          <button className="btn-ghost" style={{width:"auto", padding:"4px 10px"}} onClick={()=>setCursor(new Date(year, month+1, 1))}>›</button>
        </div>
        <div className="cal-grid">
          {BN_DAYS_SHORT.map((d,i)=><div className="cal-dow" key={i}>{d}</div>)}
          {cells.map((d,i)=>{
            if(!d) return <div key={i}></div>;
            const iso = isoDate(new Date(year, month, d));
            const its = itemsFor(iso);
            const marks = [];
            if(its.tasks.length) marks.push("var(--brick)");
            if(its.events.length) marks.push("var(--gold)");
            return (
              <div key={i}
                className={"cal-day"+(iso===todayIso()?" today":"")+(iso===selectedDate?" sel":"")}
                onClick={()=>setSelectedDate(iso)}>
                {toBn(d)}
                <div className="marks">{marks.map((c,idx)=><span key={idx} style={{background:c}}></span>)}</div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="section-title">{fmtDate(selectedDate)}</div>
      <div className="card tab-accent" style={{"--accent":"var(--gold)"}}>
        {(dayItems.tasks.length===0 && dayItems.events.length===0) ? <Empty glyph="◇" msg="এই দিনে কিছু নেই" /> :
          <React.Fragment>
            {dayItems.tasks.map(t=>(
              <div className="row" key={"t"+t.id}>
                <span className="pill" style={{background:"rgba(166,67,46,0.12)", color:"var(--brick)"}}>টাস্ক</span>
                <div className="row-title">{t.title}</div>
              </div>
            ))}
            {dayItems.events.map(e=>(
              <div className="row" key={"e"+e.id} onClick={()=>openEdit("event", e)}>
                <span className="pill" style={{background:"rgba(184,134,59,0.15)", color:"var(--gold)"}}>ইভেন্ট</span>
                <div style={{flex:1}}>
                  <div className="row-title">{e.title}</div>
                  {e.time && <div className="row-meta">{e.time}</div>}
                </div>
              </div>
            ))}
          </React.Fragment>
        }
      </div>
    </React.Fragment>
  );
}

/* ===================== Habits ===================== */
function HabitsView({state, setState, openAdd, openEdit, removeItem}){
  const days = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(isoDate(d)); }

  const toggle = (habitId, iso)=>{
    setState(s=>{
      const logs = {...s.habitLogs};
      const dayLog = {...(logs[iso]||{})};
      dayLog[habitId] = !dayLog[habitId];
      logs[iso] = dayLog;
      return {...s, habitLogs:logs};
    });
  };

  return (
    <React.Fragment>
      {state.habits.length===0 ? (
        <div className="card"><Empty glyph="◎" msg="কোনো অভ্যাস নেই — + দিয়ে নতুন অভ্যাস যোগ করো" /></div>
      ) : state.habits.map(h=>{
        let streak = 0;
        for(let i=days.length-1;i>=0;i--){
          if((state.habitLogs[days[i]]||{})[h.id]) streak++; else break;
        }
        return (
          <div className="card tab-accent" key={h.id} style={{"--accent":"var(--sage)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <div style={{fontWeight:600}} onClick={()=>openEdit("habit", h)}>{h.title}</div>
              <span className="pill" style={{background:"rgba(91,122,99,0.14)", color:"var(--sage)"}}>{toBn(streak)} দিন ধারা</span>
            </div>
            <div className="habit-week" style={{marginTop:10}}>
              {days.map(iso=>{
                const on = !!(state.habitLogs[iso]||{})[h.id];
                const d = new Date(iso);
                return (
                  <div key={iso} className={"hcell"+(on?" on":"")} onClick={()=>toggle(h.id, iso)}>
                    {BN_DAYS_SHORT[d.getDay()]}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </React.Fragment>
  );
}

/* ===================== Money management ===================== */
const EXP_CATS = [
  {key:"food", label:"খাবার", color:"var(--ochre)"},
  {key:"travel", label:"যাতায়াত", color:"var(--slate)"},
  {key:"family", label:"পরিবার", color:"var(--plum)"},
  {key:"bills", label:"বিল", color:"var(--brick)"},
  {key:"education", label:"শিক্ষা", color:"var(--green)"},
  {key:"health", label:"চিকিৎসা", color:"#B4523F"},
  {key:"other", label:"অন্যান্য", color:"var(--sage)"},
];
const INC_CATS = [
  {key:"salary", label:"বেতন", color:"var(--sage)"},
  {key:"tuition", label:"টিউশন", color:"var(--gold)"},
  {key:"gift", label:"উপহার", color:"var(--plum)"},
  {key:"other", label:"অন্যান্য", color:"var(--slate)"},
];
function catInfo(type, key){
  const list = type==="income" ? INC_CATS : EXP_CATS;
  return list.find(c=>c.key===key) || list[list.length-1];
}
function moneyFmt(n){
  const v = Math.round(Number(n||0));
  const neg = v<0;
  return (neg?"-":"") + "৳" + toBn(Math.abs(v).toLocaleString("en-US"));
}
function accountBalance(state, accId){
  const acc = state.accounts.find(a=>a.id===accId);
  const opening = acc ? Number(acc.openingBalance||0) : 0;
  const delta = state.transactions.filter(t=>t.accountId===accId)
    .reduce((s,t)=> s + (t.type==="income" ? Number(t.amount||0) : -Number(t.amount||0)), 0);
  return opening + delta;
}

function MoneyView({state, setState, addItem, updateItem, removeItem, uid, openAdd, openEdit}){
  const [filter, setFilter] = useState("all");

  const monthTx = state.transactions.filter(t=>t.date.startsWith(ym));

  const monthExpense = monthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount||0),0);
  const totalBalance = state.accounts.reduce((s,a)=>s+accountBalance(state,a.id),0);

  const byExpCat = EXP_CATS.map(c=>({...c, sum: monthTx.filter(t=>t.type==="expense" && t.category===c.key).reduce((s,t)=>s+Number(t.amount||0),0)}))
    .filter(c=>c.sum>0 || state.budgets[c.key]);

  const list = state.transactions
    .filter(t => filter==="all" ? true : t.type===filter)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  const setBudget = (catKey, val)=>{
    setState(s=>({...s, budgets:{...s.budgets, [catKey]: val}}));
  };

  return (
    <React.Fragment>
      <div className="card" style={{textAlign:"center"}}>
        <div style={{fontSize:12.5, color:"var(--muted)"}}>মোট ব্যালেন্স (সব হিসাব মিলিয়ে)</div>
        <div className="exp-total">{moneyFmt(totalBalance)}</div>
        <div className="hero-row" style={{marginTop:12}}>
          <div className="hero-stat">
            <div className="num" style={{color:"var(--sage)"}}>{moneyFmt(monthIncome)}</div>
            <div className="lbl">এই মাসের আয়</div>
          </div>
          <div className="hero-stat">
            <div className="num" style={{color:"var(--brick)"}}>{moneyFmt(monthExpense)}</div>
            <div className="lbl">এই মাসের খরচ</div>
          </div>
          <div className="hero-stat">
            <div className="num" style={{color:"var(--ochre)"}}>{moneyFmt(monthIncome-monthExpense)}</div>
            <div className="lbl">সঞ্চয়</div>
          </div>
        </div>
      </div>

      <div className="section-title">হিসাবসমূহ <span className="tag" onClick={()=>openAdd("account")}>+ নতুন হিসাব</span></div>
      <div className="card tab-accent" style={{"--accent":"var(--ochre)"}}>
        {state.accounts.map(a=>(
          <div className="row" key={a.id} onClick={()=>openEdit("account", a)}>
            <div className="row-title">{a.name}</div>
            <div style={{fontWeight:600, color: accountBalance(state,a.id)<0 ? "var(--brick)" : "var(--ink)"}}>{moneyFmt(accountBalance(state,a.id))}</div>
          </div>
        ))}
      </div>

      {byExpCat.length>0 && (
        <React.Fragment>
          <div className="section-title">এই মাসের বাজেট (খরচের খাত অনুযায়ী)</div>
          <div className="card tab-accent" style={{"--accent":"var(--ochre)"}}>
            {byExpCat.map(c=>{
              const budget = state.budgets[c.key];
              const pct = budget ? Math.min(100, Math.round(c.sum/budget*100)) : null;
              const over = budget && c.sum > budget;
              return (
                <div key={c.key} style={{marginBottom:12}} onClick={()=>setBudgetCat(c.key)}>
                  <div style={{display:"flex", justifyContent:"space-between", fontSize:13.5}}>
                    <span>{c.label}</span>
                    <span style={{color: over ? "var(--brick)" : "var(--muted)"}}>
                      {moneyFmt(c.sum)}{budget ? " / "+moneyFmt(budget) : ""}
                    </span>
                  </div>
                  {budget ? (
                    <div className="progress-track"><div className="progress-fill" style={{width:pct+"%", background: over?"var(--brick)":c.color}}></div></div>
                  ) : (
                    <div style={{fontSize:11, color:"var(--gold)", marginTop:2}}>বাজেট সেট করতে ট্যাপ করো</div>
                  )}
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}

      <div className="chip-row" style={{marginBottom:14}}>
        {[["all","সব"],["income","আয়"],["expense","খরচ"]].map(([k,l])=>(
          <div key={k} className={"chip"+(filter===k?" sel":"")} style={{"--accent":"var(--ochre)"}} onClick={()=>setFilter(k)}>{l}</div>
        ))}
      </div>
      <div className="section-title">লেনদেন</div>
      <div className="card tab-accent" style={{"--accent":"var(--ochre)"}}>
        {list.length===0 ? <Empty glyph="৳" msg="কোনো লেনদেন নেই — নিচের + বাটনে যোগ করো" /> :
          list.map(t=>{
            const cat = catInfo(t.type, t.category);
            const acc = state.accounts.find(a=>a.id===t.accountId);
            const isIncome = t.type==="income";
            return (
              <div className="row" key={t.id} onClick={()=>openEdit("transaction", t)}>
                <span className="pill" style={{background: isIncome ? "rgba(91,122,99,0.14)" : "rgba(140,109,52,0.14)", color: isIncome?"var(--sage)":"var(--ochre)"}}>{cat.label}</span>
                <div style={{flex:1}}>
                  <div className="row-title">{t.note || cat.label}</div>
                  <div className="row-meta">{fmtDate(t.date)}{acc ? " · "+acc.name : ""}</div>
                </div>
                <div style={{fontWeight:600, color: isIncome ? "var(--sage)" : "var(--brick)"}}>{isIncome?"+":"-"}{moneyFmt(t.amount)}</div>
              </div>
            );
          })
        }
      </div>

      {budgetCat && (
        <BudgetForm catKey={budgetCat} current={state.budgets[budgetCat]}
          onSave={(val)=>{ setBudget(budgetCat, val); setBudgetCat(null); }}
          onClose={()=>setBudgetCat(null)} />
      )}
    </React.Fragment>
  );
}

function BudgetForm({catKey, current, onSave, onClose}){
  const [val, setVal] = useState(current || "");
  const cat = catInfo("expense", catKey);
  return (
    <Sheet title={cat.label+" — মাসিক বাজেট"} onClose={onClose}>
      <div className="field"><label>মাসিক সীমা (৳)</label><input autoFocus type="number" value={val} onChange={e=>setVal(e.target.value)} placeholder="০" /></div>
      <button className="btn btn-primary" onClick={()=>onSave(Number(val)||0)}>সংরক্ষণ করো</button>
      {current ? <button className="btn btn-danger" onClick={()=>onSave(0)}>বাজেট মুছে ফেলো</button> : null}
    </Sheet>
  );
}


/* ===================== Modal Router ===================== */
function ModalRouter({modal, state, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const {type, data} = modal;
  if(type==="task") return <TaskForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="event") return <EventForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="habit") return <HabitForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="goal") return <GoalForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="note") return <NoteForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="transaction") return <TransactionForm state={state} data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  if(type==="account") return <AccountForm data={data} addItem={addItem} updateItem={updateItem} removeItem={removeItem} uid={uid} onClose={onClose} showToast={showToast} />;
  return null;
}

function TaskForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const preset = data && data.presetGoalId;
  const [title, setTitle] = useState(data && !preset ? data.title : "");
  const [dueDate, setDueDate] = useState(data && !preset ? (data.dueDate||"") : "");
  const [dueTime, setDueTime] = useState(data && !preset ? (data.dueTime||"") : "");
  const [priority, setPriority] = useState(data && !preset ? (data.priority||"normal") : "normal");
  const [goalId, setGoalId] = useState(preset || (data && data.goalId) || "");
  const isEdit = data && !preset;

  const save = ()=>{
    if(!title.trim()) return;
    if(isEdit){ updateItem("tasks", data.id, {title, dueDate, dueTime, priority, goalId: goalId||null}); showToast("টাস্ক আপডেট হয়েছে"); }
    else { addItem("tasks", {id:uid(), title, dueDate, dueTime, priority, goalId: goalId||null, done:false, createdAt:Date.now()}); showToast("টাস্ক যোগ হয়েছে"); }
    onClose();
  };
  return (
    <Sheet title={isEdit?"টাস্ক এডিট করো":"নতুন টাস্ক"} onClose={onClose}>
      <div className="field"><label>টাস্কের নাম</label><input autoFocus value={title} onChange={e=>setTitle(e.target.value)} placeholder="যেমন: রুটিন রিপোর্ট জমা দেওয়া" /></div>
      <div className="field"><label>ডেডলাইন তারিখ</label><input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} /></div>
      <div className="field"><label>সময় (রিমাইন্ডারের জন্য, ঐচ্ছিক)</label><input type="time" value={dueTime} onChange={e=>setDueTime(e.target.value)} /></div>
      <div className="field">
        <label>গুরুত্ব</label>
        <div className="chip-row">
          {[["normal","সাধারণ"],["high","জরুরি"]].map(([k,l])=>(
            <div key={k} className={"chip"+(priority===k?" sel":"")} style={{"--accent":"var(--brick)"}} onClick={()=>setPriority(k)}>{l}</div>
          ))}
        </div>
      </div>
      <div className="field">
        <label>গোলের সাথে লিংক (ঐচ্ছিক)</label>
        <select value={goalId} onChange={e=>setGoalId(e.target.value)}>
          <option value="">— কোনোটি না —</option>
          {state.goals.map(g=><option key={g.id} value={g.id}>{g.title}</option>)}
        </select>
      </div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {isEdit && <button className="btn btn-danger" onClick={()=>{removeItem("tasks", data.id); onClose();}}>টাস্ক মুছে ফেলো</button>}
    </Sheet>
  );
}

  const [date, setDate] = useState(data?data.date:todayIso());

    if(!title.trim()) return;
    if(data){ updateItem("events", data.id, {title, date, time}); showToast("ইভেন্ট আপডেট হয়েছে"); }
    else { addItem("events", {id:uid(), title, date, time}); showToast("ইভেন্ট যোগ হয়েছে"); }

    <Sheet title={data?"ইভেন্ট এডিট করো":"নতুন ইভেন্ট"} onClose={onClose}>

      <div className="field"><label>তারিখ</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
      <div className="field"><label>সময় (ঐচ্ছিক)</label><input type="time" value={time} onChange={e=>setTime(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>

  );
}

      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>

function GoalForm({data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [title, setTitle] = useState(data?data.title:"");
  const [deadline, setDeadline] = useState(data?(data.deadline||""):"");
  const save = ()=>{
    if(!title.trim()) return;
    if(data){ updateItem("goals", data.id, {title, deadline}); showToast("গোল আপডেট হয়েছে"); }

  };
  return (
    <Sheet title={data?"গোল এডিট করো":"নতুন গোল"} onClose={onClose}>

      <div className="field"><label>লক্ষ্য তারিখ (ঐচ্ছিক)</label><input type="date" value={deadline} onChange={e=>setDeadline(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {data && (
        <React.Fragment>
          <button className="btn btn-ghost" onClick={()=>{updateItem("goals", data.id, {done:true}); onClose();}}>গোল সম্পন্ন হিসেবে চিহ্নিত করো</button>
          <button className="btn btn-danger" onClick={()=>{removeItem("goals", data.id); onClose();}}>গোল মুছে ফেলো</button>
        </React.Fragment>
      )}
    </Sheet>

}

function NoteForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [title, setTitle] = useState(data?(data.title||""):"");
  const [body, setBody] = useState(data?data.body:"");
  const [goalId, setGoalId] = useState(data?(data.goalId||""):"");
  const save = ()=>{
    if(!body.trim()) return;
    if(data){ updateItem("notes", data.id, {title, body, goalId: goalId||null, updatedAt:Date.now()}); showToast("নোট আপডেট হয়েছে"); }
    else { addItem("notes", {id:uid(), title, body, goalId: goalId||null, updatedAt:Date.now()}); showToast("নোট যোগ হয়েছে"); }
    onClose();
  };
  return (
    <Sheet title={data?"নোট এডিট করো":"নতুন নোট"} onClose={onClose}>
      <div className="field"><label>শিরোনাম (ঐচ্ছিক)</label><input value={title} onChange={e=>setTitle(e.target.value)} /></div>
      <div className="field"><label>লেখা</label><textarea autoFocus value={body} onChange={e=>setBody(e.target.value)} placeholder="তোমার নোট লেখো..." /></div>
      <div className="field">
        <label>গোলের সাথে লিংক (ঐচ্ছিক)</label>
        <select value={goalId} onChange={e=>setGoalId(e.target.value)}>
          <option value="">— কোনোটি না —</option>
          {state.goals.map(g=><option key={g.id} value={g.id}>{g.title}</option>)}
        </select>
      </div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {data && <button className="btn btn-danger" onClick={()=>{removeItem("notes", data.id); onClose();}}>নোট মুছে ফেলো</button>}
    </Sheet>
  );
}

function TransactionForm({state, data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [type, setType] = useState(data?data.type:"expense");
  const [amount, setAmount] = useState(data?data.amount:"");
  const [category, setCategory] = useState(data?data.category:"food");
  const [accountId, setAccountId] = useState(data?data.accountId:(state.accounts[0]?state.accounts[0].id:""));
  const [note, setNote] = useState(data?(data.note||""):"");
  const [date, setDate] = useState(data?data.date:todayIso());
  const cats = type==="income" ? INC_CATS : EXP_CATS;

  const switchType = (t)=>{
    setType(t);
    const list = t==="income" ? INC_CATS : EXP_CATS;
    if(!list.find(c=>c.key===category)) setCategory(list[0].key);
  };

  const save = ()=>{
    if(!amount || Number(amount)<=0 || !accountId) return;
    const payload = {type, amount:Number(amount), category, accountId, note, date};
    if(data){ updateItem("transactions", data.id, payload); showToast("লেনদেন আপডেট হয়েছে"); }
    else { addItem("transactions", {id:uid(), ...payload}); showToast("লেনদেন যোগ হয়েছে"); }
    onClose();
  };
  return (
    <Sheet title={data?"লেনদেন এডিট করো":"নতুন লেনদেন"} onClose={onClose}>
      <div className="field">
        <div className="chip-row">
          {[["expense","খরচ","var(--brick)"],["income","আয়","var(--sage)"]].map(([k,l,c])=>(
            <div key={k} className={"chip"+(type===k?" sel":"")} style={{"--accent":c}} onClick={()=>switchType(k)}>{l}</div>
          ))}
        </div>
      </div>
      <div className="field"><label>পরিমাণ (৳)</label><input autoFocus type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="০" /></div>
      <div className="field">
        <label>খাত</label>
        <div className="chip-row">
          {cats.map(c=>(
            <div key={c.key} className={"chip"+(category===c.key?" sel":"")} style={{"--accent":c.color}} onClick={()=>setCategory(c.key)}>{c.label}</div>
          ))}
        </div>
      </div>
      <div className="field">
        <label>হিসাব</label>
        <select value={accountId} onChange={e=>setAccountId(e.target.value)}>
          {state.accounts.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
      </div>
      <div className="field"><label>নোট (ঐচ্ছিক)</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="যেমন: রিকশা ভাড়া" /></div>
      <div className="field"><label>তারিখ</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {data && <button className="btn btn-danger" onClick={()=>{removeItem("transactions", data.id); onClose();}}>লেনদেন মুছে ফেলো</button>}
    </Sheet>
  );
}

function AccountForm({data, addItem, updateItem, removeItem, uid, onClose, showToast}){
  const [name, setName] = useState(data?data.name:"");
  const [openingBalance, setOpeningBalance] = useState(data?data.openingBalance:"0");
  const save = ()=>{
    if(!name.trim()) return;
    if(data){ updateItem("accounts", data.id, {name, openingBalance:Number(openingBalance)||0}); showToast("হিসাব আপডেট হয়েছে"); }
    else { addItem("accounts", {id:uid(), name, openingBalance:Number(openingBalance)||0}); showToast("হিসাব যোগ হয়েছে"); }
    onClose();
  };
  return (
    <Sheet title={data?"হিসাব এডিট করো":"নতুন হিসাব"} onClose={onClose}>
      <div className="field"><label>হিসাবের নাম</label><input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="যেমন: bKash" /></div>
      <div className="field"><label>শুরুর ব্যালেন্স (৳)</label><input type="number" value={openingBalance} onChange={e=>setOpeningBalance(e.target.value)} /></div>
      <button className="btn btn-primary" onClick={save}>সংরক্ষণ করো</button>
      {data && <button className="btn btn-danger" onClick={()=>{removeItem("accounts", data.id); onClose();}}>হিসাব মুছে ফেলো</button>}
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
