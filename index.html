<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HAIS — Heritage Academic Intelligence System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0eeff;color:#1a1a2e;min-height:100vh}
input,select,button{font-family:sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c0b8f0;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 10px;background:#ede9fd;color:#5344b5;text-align:left;font-weight:600;border-bottom:2px solid #5344b520}
td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.07)}
tr:hover td{background:#f8f7ff}
input[type=number],input[type=text]{width:100%;padding:8px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#5344b5;box-shadow:0 0 0 2px #5344b520}
select{padding:8px 12px;border:1px solid rgba(0,0,0,0.15);border-radius:8px;font-size:14px;outline:none;background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;
const LS_KEY="hais_data_v2";
const LS_EXPORT_KEY="hais_last_export_v1";

const DEFAULT_STUDENTS={
  "IV":["ARHAM RAFIN"],
  "V":["MD.MURSALIN SHEIKH","ABDULLAH AL TAMIM","ALIF ISLAM","ARIFUL PRAMANIK","ASIBUL ISLAM LIHAD CHOWDURY","HABIBUR RAHMAN BEPARI","HUJAIFA BIN SALMAN","SOHAN KHAN","TAWHID MAHTAB"],
  "VI":["MIR TANZIBUL ISLAM","HASNAT IMTIAZ TASHIN","MUBASHIR RAHMAN NAFIJ SIKDER","MD. AL AMIN","IFAT UDDIN","MD. SALMAN ALI KHAN","ROOZBEH ZAIN","TANJIM ISLAM TAMIM","ABU BOKKOR SHEIKH","AL MUBASSIR MUNSHI","BAYEJID SHEIKH","UDVAB DAS ARNOB","MD SOHANUR RAHMAN SIYAM","ABIR KHAN"],
  "VII":["SHAMSUL ALAM JOBAYER","SAKIBUL HASAN","MAHIDUL BISWAS","JISAN","MD NAZMUL SAKIB","ANTOR KUMAR GHOSH","MUBASSHIR IMAN","HOSSAIN FIROZ","AL RAFI","MD.ABDULLAH SHEIKH","MESBAH UDDIN KHOLIFA","APON SUTRODHAR","MD SIYAM MOLLA"],
  "VIII":["MD WALIDUJJAMAN SOHAN","RAKIBUL MUNSHI","SYED MD TANZIM HUDA","RAJBE NUR ISLAM","SAIFULLAH SADAT JARRAH","SALAMA SABIT","ZIHAD AHMED SHARON","MD. MOSHIUR RAHMAN","MD MEZBAUL ISLAM","SHAH MUHAMMAD MAHI","ENAMUL HAQUE SIFAT","KAZI FAYEKUZZAMAN","MD.TAYEB HASAN MUSA","MD.ALIF RAHMAN","MD. REZWAN AHMED","MD ARAF SARDER","TAMIM KAZI","SHAHRIAR MAHMUD","HAMIDUR RAHMAN","SIMRAN HOSSAIN RIHAD","MD FARHAN RAHMAN AVI","ARAFAT MIA"],
  "IX":["ABUL HAYAT","SAHADAT BEPARY","MD ABDULLAH BIN RAJ","RIYAN KHAN","MD.ADOL","NAZMUS SAKIB","AMIR HAMJA GIHAD","MASHFIN MAHIN","MD.SAMIR KHAN","ABIR BISWAS","BISHWJIT BISWAS TIRTHO","FAHAD HOSSEN","MD.AHSANUL ISLAM MAHIM","RAFIUL ISLAM AYAN","SHAJID KHAN MAHIN","KHANDOKER FARHAN","RAFIUL BAIZED","MD SIZAN SHEIKH","MD ABDULLAH"],
  "X":["MD. FAHIM FOKIR","MD. SIAM MONDOL","MD. SHAWON MONDOL","MD. TAHSIN ZAMAN","SAFWAN BIN SATTAR","SHAFAYET BIN JABBAR","ARHAM HASAN AKASH","SHAHRIAR NAFIZ SIFAT","ABDULLAH MOMIN","MD SHAD REZA","SOHEL MRIDHA","MD. SHOHIDUL ISLAM","MITUL BHUIYA","ABDULLAH BIN MUKHTER","MUNNA KHA","SABID ISLAM","MD. ALAMIN MRIDHA","SHAHRIYA MATUBBER","ADNAN HOSSEN ALIF","MUHTAMIM KABIR","S M RAHMAT ULLAH","AL HOSSAIN","MD OMOR FARUK TALHA","TAWHID ISLAM"]
};
const DEFAULT_TEACHERS=["MD ABU SAYED","MD. RAMJAN ALI","Shariful Islam","Saiful Islam","Siraful Islam","MEHEDI HASAN","Md. Badsha Khan","Alhaz Sheikh","MD. FAYSAL SHEIK","MD HASIBUL HASAN","MD. ARIFUZZAMAN","LUTFOR RAHMAN","IMRAN MUNSI","MD. SHOHAN MUNSHI","ABDULLAH AL ZUBAIR KHAN","RABBI HOSSEN","MD. RAFIQ AHMED","ABU NAIM","MD. SHORIFUL ISLAM","ABDUL KUDDUS MIA"];

// dynamic — will be set from App state
let STUDENTS=DEFAULT_STUDENTS;
let TEACHERS=DEFAULT_TEACHERS;

/* ══ ম্যানেজমেন্ট মডিউল (শিক্ষার্থী ও শিক্ষক যুক্ত/মুছুন) ══ */
function Manage({students,setStudents,teachers,setTeachers}){
  const [tab,setTab]=useState("student");
  const [newStudentName,setNewStudentName]=useState("");
  const [newStudentCls,setNewStudentCls]=useState("VI");
  const [newTeacherName,setNewTeacherName]=useState("");
  const [msg,setMsg]=useState("");
  const [msgColor,setMsgColor]=useState(C.gr);
  const [confirmDel,setConfirmDel]=useState(null); // {type,name,cls?}

  const showMsg=(text,color=C.gr)=>{setMsg(text);setMsgColor(color);setTimeout(()=>setMsg(""),3000);};

  const addStudent=()=>{
    const name=newStudentName.trim().toUpperCase();
    if(!name){showMsg("নাম লিখুন",C.re);return;}
    if((students[newStudentCls]||[]).includes(name)){showMsg("এই নামের শিক্ষার্থী ইতোমধ্যে আছে",C.re);return;}
    setStudents(prev=>{const updated={...prev};updated[newStudentCls]=[...(updated[newStudentCls]||[]),name];return updated;});
    setNewStudentName("");
    showMsg(`✓ ${name} (শ্রেণি ${newStudentCls}) যুক্ত হয়েছে`);
  };

  const removeStudent=(cls,name)=>{
    setStudents(prev=>{const updated={...prev};updated[cls]=(updated[cls]||[]).filter(n=>n!==name);return updated;});
    setConfirmDel(null);
    showMsg(`✓ ${name} মুছে ফেলা হয়েছে`);
  };

  const addTeacher=()=>{
    const name=newTeacherName.trim();
    if(!name){showMsg("নাম লিখুন",C.re);return;}
    if(teachers.includes(name)){showMsg("এই নামের শিক্ষক ইতোমধ্যে আছেন",C.re);return;}
    setTeachers(prev=>[...prev,name]);
    setNewTeacherName("");
    showMsg(`✓ ${name} যুক্ত হয়েছেন`);
  };

  const removeTeacher=(name)=>{
    setTeachers(prev=>prev.filter(t=>t!==name));
    setConfirmDel(null);
    showMsg(`✓ ${name} মুছে ফেলা হয়েছে`);
  };

  const totalStudents=Object.values(students).reduce((a,b)=>a+b.length,0);

  return(<div>
    <H2>⚙️ তালিকা ব্যবস্থাপনা</H2>

    {msg&&<div style={{background:msgColor+"18",border:`1px solid ${msgColor}40`,borderRadius:8,padding:"8px 12px",fontSize:13,color:msgColor,fontWeight:600,marginBottom:10}}>{msg}</div>}

    {/* ট্যাব */}
    <div style={{display:"flex",gap:6,marginBottom:12}}>
      {[{id:"student",label:`👨‍🎓 শিক্ষার্থী (${totalStudents})`},{id:"teacher",label:`👩‍🏫 শিক্ষক (${teachers.length})`}].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"7px 14px",borderRadius:16,border:`1px solid ${tab===t.id?C.pu:C.bd}`,background:tab===t.id?C.puL:"transparent",color:tab===t.id?C.pu:C.mu,cursor:"pointer",fontSize:12,fontWeight:tab===t.id?700:400}}>{t.label}</button>
      ))}
    </div>

    {/* ── শিক্ষার্থী ট্যাব ── */}
    {tab==="student"&&(<div>
      <Card>
        <H3>➕ নতুন শিক্ষার্থী যুক্ত করুন</H3>
        <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
          <input type="text" placeholder="শিক্ষার্থীর নাম (ইংরেজিতে)" value={newStudentName}
            onChange={e=>setNewStudentName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addStudent()}
            style={{flex:"1 1 180px",minWidth:0}}/>
          <select value={newStudentCls} onChange={e=>setNewStudentCls(e.target.value)} style={{flex:"0 0 auto"}}>
            {Object.keys(students).map(c=><option key={c} value={c}>শ্রেণি {c}</option>)}
          </select>
          <button onClick={addStudent} style={{padding:"8px 16px",borderRadius:8,border:"none",background:C.pu,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13,flexShrink:0}}>যুক্ত করুন</button>
        </div>
        <div style={{fontSize:11,color:C.mu}}>💡 নাম স্বয়ংক্রিয়ভাবে বড় হাতে রূপান্তর হবে। Enter চেপেও যুক্ত করা যাবে।</div>
      </Card>

      {/* শ্রেণিভিত্তিক তালিকা */}
      {Object.entries(students).map(([cls,names])=>(
        <Card key={cls} style={{marginBottom:10}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <H3 style={{marginBottom:0}}>শ্রেণি {cls}</H3>
            <span style={{fontSize:11,color:C.mu,background:C.puL,padding:"2px 8px",borderRadius:10,fontWeight:600}}>{names.length} জন</span>
          </div>
          {names.length===0&&<div style={{fontSize:12,color:C.mu,fontStyle:"italic"}}>কোনো শিক্ষার্থী নেই</div>}
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {names.map(name=>(
              <div key={name} style={{display:"flex",alignItems:"center",gap:4,background:C.puL,border:`1px solid ${C.pu}30`,borderRadius:20,padding:"4px 8px 4px 10px",fontSize:12}}>
                <span style={{color:C.pu,fontWeight:600}}>{name}</span>
                <button onClick={()=>setConfirmDel({type:"student",name,cls})} style={{width:16,height:16,borderRadius:"50%",border:"none",background:C.re+"33",color:C.re,cursor:"pointer",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>✕</button>
              </div>
            ))}
          </div>
        </Card>
      ))}
    </div>)}

    {/* ── শিক্ষক ট্যাব ── */}
    {tab==="teacher"&&(<div>
      <Card>
        <H3>➕ নতুন শিক্ষক যুক্ত করুন</H3>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <input type="text" placeholder="শিক্ষকের নাম" value={newTeacherName}
            onChange={e=>setNewTeacherName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addTeacher()}
            style={{flex:1}}/>
          <button onClick={addTeacher} style={{padding:"8px 16px",borderRadius:8,border:"none",background:C.te,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13,flexShrink:0}}>যুক্ত করুন</button>
        </div>
        <div style={{fontSize:11,color:C.mu}}>💡 Enter চেপেও যুক্ত করা যাবে।</div>
      </Card>

      <Card>
        <H3>শিক্ষক তালিকা ({teachers.length} জন)</H3>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {teachers.map((name,i)=>(
            <div key={name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",background:i%2===0?"#f8f7ff":"#fff",borderRadius:8,border:`1px solid ${C.bd}`}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:C.teL,color:C.te,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:10,flexShrink:0}}>
                  {name.split(" ").map(w=>w[0]).filter(Boolean).slice(0,2).join("")}
                </div>
                <span style={{fontWeight:600,fontSize:13}}>{name}</span>
              </div>
              <button onClick={()=>setConfirmDel({type:"teacher",name})} style={{padding:"4px 10px",borderRadius:8,border:`1px solid ${C.re}40`,background:C.reL,color:C.re,cursor:"pointer",fontSize:11,fontWeight:700}}>মুছুন</button>
            </div>
          ))}
          {teachers.length===0&&<div style={{textAlign:"center",color:C.mu,padding:20,fontSize:13}}>কোনো শিক্ষক নেই</div>}
        </div>
      </Card>
    </div>)}

    {/* মুছে ফেলার নিশ্চিতকরণ পপআপ */}
    {confirmDel&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"#fff",borderRadius:14,padding:20,maxWidth:320,width:"100%",textAlign:"center"}}>
          <div style={{fontSize:28,marginBottom:8}}>⚠️</div>
          <div style={{fontWeight:700,fontSize:15,marginBottom:6,color:C.tx}}>নিশ্চিত করুন</div>
          <div style={{fontSize:13,color:C.mu,marginBottom:16}}>
            <span style={{fontWeight:700,color:C.re}}>{confirmDel.name}</span>
            {confirmDel.type==="student"?` (শ্রেণি ${confirmDel.cls})`:""}
            {" "}মুছে ফেলবেন?<br/>
            <span style={{fontSize:11}}>এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।</span>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"center"}}>
            <button onClick={()=>setConfirmDel(null)} style={{padding:"8px 18px",borderRadius:8,border:`1px solid ${C.bd}`,background:"#fff",cursor:"pointer",fontSize:13}}>বাতিল</button>
            <button onClick={()=>confirmDel.type==="student"?removeStudent(confirmDel.cls,confirmDel.name):removeTeacher(confirmDel.name)} style={{padding:"8px 18px",borderRadius:8,border:"none",background:C.re,color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700}}>হ্যাঁ, মুছুন</button>
          </div>
        </div>
      </div>
    )}
  </div>);
}
const SUBJECTS_BY_CLASS={
  "IV":["বাংলা","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বাংলাদেশ ও বিশ্বপরিচয়","বিজ্ঞান","ধর্ম"],
  "V":["বাংলা","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বাংলাদেশ ও বিশ্বপরিচয়","বিজ্ঞান","ধর্ম"],
  "VI":["বাংলা প্রথম পত্র","বাংলা দ্বিতীয় পত্র","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বিজ্ঞান","বাংলাদেশ ও বিশ্বপরিচয়","কৃষি শিক্ষা","ধর্ম","তথ্য ও যোগাযোগ প্রযুক্তি"],
  "VII":["বাংলা প্রথম পত্র","বাংলা দ্বিতীয় পত্র","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বিজ্ঞান","বাংলাদেশ ও বিশ্বপরিচয়","কৃষি শিক্ষা","ধর্ম","তথ্য ও যোগাযোগ প্রযুক্তি"],
  "VIII":["বাংলা প্রথম পত্র","বাংলা দ্বিতীয় পত্র","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বিজ্ঞান","বাংলাদেশ ও বিশ্বপরিচয়","কৃষি শিক্ষা","ধর্ম","তথ্য ও যোগাযোগ প্রযুক্তি"],
  "IX":["বাংলা প্রথম পত্র","বাংলা দ্বিতীয় পত্র","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বাংলাদেশ ও বিশ্বপরিচয়","বিজ্ঞান","ধর্ম","তথ্য ও যোগাযোগ প্রযুক্তি","পদার্থবিজ্ঞান","রসায়ন","জীববিজ্ঞান","উচ্চতর গণিত","ইতিহাস","ভূগোল","কৃষি শিক্ষা","অর্থনীতি","হিসাববিজ্ঞান","ব্যবসায় উদ্যোগ","ফিনান্স ও ব্যাংকিং"],
  "X":["বাংলা প্রথম পত্র","বাংলা দ্বিতীয় পত্র","English প্রথম পত্র","English দ্বিতীয় পত্র","গণিত","বাংলাদেশ ও বিশ্বপরিচয়","বিজ্ঞান","ধর্ম","তথ্য ও যোগাযোগ প্রযুক্তি","পদার্থবিজ্ঞান","রসায়ন","জীববিজ্ঞান","উচ্চতর গণিত","ইতিহাস","ভূগোল","কৃষি শিক্ষা","অর্থনীতি","হিসাববিজ্ঞান","ব্যবসায় উদ্যোগ","ফিনান্স ও ব্যাংকিং"],
};
const SUBJECTS=[...new Set(Object.values(SUBJECTS_BY_CLASS).flat())];
const EXAM_LOWER=["Chapter Final","First Term","Second Term","Third Term"];
const EXAM_UPPER=["Chapter Final","Fortnightly Exam","Half-Yearly Exam","Annual Exam"];
const EXAM_ORDER={"Chapter Final":1,"First Term":2,"Fortnightly Exam":2,"Second Term":3,"Half-Yearly Exam":3,"Third Term":4,"Annual Exam":4};

const C={pu:"#5344b5",puL:"#ede9fd",te:"#0f6e56",teL:"#e1f5ee",co:"#993c1d",coL:"#faece7",am:"#854f0b",amL:"#faeeda",re:"#a32d2d",reL:"#fcebeb",gr:"#3b6d11",grL:"#eaf3de",bd:"rgba(0,0,0,0.11)",bg:"#f0eeff",cd:"#fff",tx:"#1a1a2e",mu:"#6b6b8a"};

const getGrade=(m,fm=100,pm=33)=>{
  if(m<pm)return["F",C.re];
  const pct=m/fm*100;
  if(pct>=80)return["A+",C.gr];if(pct>=70)return["A",C.te];if(pct>=60)return["A-",C.te];
  if(pct>=50)return["B",C.am];if(pct>=40)return["C",C.am];return["D",C.co];
};
const badge=(color,text)=>(<span style={{display:"inline-block",padding:"2px 9px",borderRadius:20,fontSize:11,background:color+"22",color,fontWeight:700,border:`1px solid ${color}44`}}>{text}</span>);
function Stat({label,value,color,sub}){return(<div style={{background:color+"18",border:`1px solid ${color}30`,borderRadius:10,padding:"12px 10px",textAlign:"center"}}><div style={{fontSize:24,fontWeight:700,color}}>{value}</div><div style={{fontSize:11,color:C.mu,marginTop:2}}>{label}</div>{sub&&<div style={{fontSize:10,color,marginTop:2}}>{sub}</div>}</div>);}
function Card({children,style={}}){return <div style={{background:C.cd,border:`1px solid ${C.bd}`,borderRadius:12,padding:14,marginBottom:12,...style}}>{children}</div>;}
function H2({children}){return <div style={{fontSize:17,fontWeight:700,marginBottom:12,color:C.pu}}>{children}</div>}
function H3({children,style={}}){return <div style={{fontSize:13,fontWeight:700,marginBottom:8,color:C.tx,...style}}>{children}</div>}

function BarChart({data,height=90,color=C.pu}){
  if(!data||data.length===0)return null;
  const max=Math.max(...data.map(d=>d.value),1);
  const W=Math.max(300,data.length*44);
  const bw=Math.min(34,Math.floor((W/data.length)*0.65));
  return(<div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}><svg width={W} height={height+36} style={{display:"block"}}>{data.map((d,i)=>{const x=i*(W/data.length)+(W/data.length-bw)/2;const bh=max>0?Math.round((d.value/max)*(height-10)):0;const y=height-bh;const barC=d.color||color;return(<g key={i}><rect x={x} y={y} width={bw} height={bh} rx={4} fill={barC} opacity={0.85}/><text x={x+bw/2} y={y-4} textAnchor="middle" fontSize={10} fill={barC} fontWeight={700}>{d.value||""}</text><text x={x+bw/2} y={height+14} textAnchor="middle" fontSize={9} fill={C.mu}>{d.label}</text></g>);})}<line x1={0} y1={height} x2={W} y2={height} stroke={C.bd} strokeWidth={1}/></svg></div>);
}

function LineChart({points,color=C.pu,height=70}){
  if(!points||points.length<2)return(<div style={{textAlign:"center",color:C.mu,fontSize:12,padding:16}}>কমপক্ষে ২টি পরীক্ষার ফলাফল দরকার</div>);
  const W=280;const vals=points.map(p=>p.v);const mn=Math.min(...vals)-5,mx=Math.max(...vals)+5;const range=mx-mn||1;
  const px=(i)=>Math.round((i/(points.length-1))*(W-30))+15;
  const py=(v)=>Math.round(height-((v-mn)/range)*(height-16))-8;
  const pathD=points.map((p,i)=>`${i===0?"M":"L"}${px(i)},${py(p.v)}`).join(" ");
  const trend=vals[vals.length-1]-vals[0];const tColor=trend>=0?C.gr:C.re;
  return(<div><svg width="100%" viewBox={`0 0 ${W} ${height+20}`} style={{display:"block"}}><path d={pathD} fill="none" stroke={color} strokeWidth={2.5} strokeLinejoin="round" strokeLinecap="round"/>{points.map((p,i)=>(<g key={i}><circle cx={px(i)} cy={py(p.v)} r={4} fill={color}/><text x={px(i)} y={py(p.v)-8} textAnchor="middle" fontSize={10} fill={color} fontWeight={700}>{p.v}</text><text x={px(i)} y={height+14} textAnchor="middle" fontSize={8} fill={C.mu}>{p.label}</text></g>))}<line x1={0} y1={height} x2={W} y2={height} stroke={C.bd} strokeWidth={0.8}/></svg><div style={{fontSize:12,color:tColor,fontWeight:700,textAlign:"right",marginTop:2}}>{trend>=0?"▲ উন্নতি":"▼ হ্রাস"}: {Math.abs(trend)} নম্বর</div></div>);
}

function DonutChart({pass,fail,total}){
  if(total===0)return null;
  const r=38,cx=50,cy=50,circ=2*Math.PI*r,passFrac=pass/total,passArc=circ*passFrac,failArc=circ*(1-passFrac);
  return(<svg width={100} height={100} viewBox="0 0 100 100"><circle cx={cx} cy={cy} r={r} fill="none" stroke={C.reL} strokeWidth={12}/><circle cx={cx} cy={cy} r={r} fill="none" stroke={C.gr} strokeWidth={12} strokeDasharray={`${passArc} ${failArc}`} strokeDashoffset={circ/4} strokeLinecap="round"/><text x={cx} y={cy-4} textAnchor="middle" fontSize={15} fontWeight={700} fill={C.pu}>{Math.round(passFrac*100)}%</text><text x={cx} y={cy+12} textAnchor="middle" fontSize={9} fill={C.mu}>পাস রেট</text></svg>);
}

/* ══ শিক্ষক পর্যবেক্ষণ মডিউল ══ */
function TeacherObservation({obsData,setObsData}){
  const [tab,setTab]=useState("attendance");
  const [selTeacher,setSelTeacher]=useState(TEACHERS[0]);

  const obs=obsData[selTeacher]||{attendance:[],inspections:[],syllabus:[],trainings:[],feedback:[]};

  const updateObs=(field,val)=>{
    setObsData(prev=>({...prev,[selTeacher]:{...(prev[selTeacher]||{}), [field]:val}}));
  };

  /* উপস্থিতি হিসাব */
  const attList=obs.attendance||[];
  const presentDays=attList.filter(a=>a.status==="present").length;
  const lateCount=attList.filter(a=>a.status==="late").length;
  const totalDays=attList.length;
  const attPct=totalDays?Math.round((presentDays+lateCount*0.5)/totalDays*100):0;

  /* সিলেবাস কভারেজ */
  const sylList=obs.syllabus||[];
  const coveredTopics=sylList.filter(s=>s.covered).length;
  const totalTopics=sylList.length;
  const sylPct=totalTopics?Math.round(coveredTopics/totalTopics*100):0;

  /* ফিডব্যাক গড় */
  const fbList=obs.feedback||[];
  const avgFb=fbList.length?Math.round(fbList.reduce((a,b)=>a+(b.rating||0),0)/fbList.length*10)/10:0;

  /* পরিদর্শন গড় */
  const insList=obs.inspections||[];
  const avgIns=insList.length?Math.round(insList.reduce((a,b)=>a+(b.score||0),0)/insList.length*10)/10:0;

  const addAttendance=(status)=>{
    const today=new Date().toLocaleDateString("bn-BD");
    const newEntry={date:today,status};
    updateObs("attendance",[...attList,newEntry]);
  };

  const addInspection=(score,remarks)=>{
    const today=new Date().toLocaleDateString("bn-BD");
    updateObs("inspections",[...insList,{date:today,score:parseInt(score)||0,remarks}]);
  };

  const toggleSyllabus=(idx)=>{
    const updated=sylList.map((s,i)=>i===idx?{...s,covered:!s.covered}:s);
    updateObs("syllabus",updated);
  };

  const addSyllabusTopic=(topic,subject)=>{
    updateObs("syllabus",[...sylList,{topic,subject,covered:false}]);
  };

  const addTraining=(name,date,hours)=>{
    updateObs("trainings",[...(obs.trainings||[]),{name,date,hours:parseInt(hours)||0}]);
  };

  const addFeedback=(cls,rating,comment)=>{
    updateObs("feedback",[...fbList,{cls,rating:parseInt(rating)||3,comment,date:new Date().toLocaleDateString("bn-BD")}]);
  };

  return(<div>
    <H2>👁 শিক্ষক পর্যবেক্ষণ</H2>

    {/* শিক্ষক নির্বাচন */}
    <Card style={{padding:"10px 12px",marginBottom:10}}>
      <div style={{fontSize:12,color:C.mu,marginBottom:5}}>শিক্ষক নির্বাচন</div>
      <select value={selTeacher} onChange={e=>setSelTeacher(e.target.value)} style={{width:"100%"}}>
        {TEACHERS.map(t=><option key={t} value={t}>{t}</option>)}
      </select>
    </Card>

    {/* সারসংক্ষেপ কার্ড */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
      <Stat label="উপস্থিতি হার" value={totalDays?`${attPct}%`:"—"} color={attPct>=85?C.gr:attPct>=70?C.am:C.re} sub={`${totalDays}টি কার্যদিবস`}/>
      <Stat label="সিলেবাস কভার" value={totalTopics?`${sylPct}%`:"—"} color={sylPct>=75?C.gr:sylPct>=50?C.am:C.re} sub={`${coveredTopics}/${totalTopics} টপিক`}/>
      <Stat label="পরিদর্শন স্কোর" value={insList.length?`${avgIns}/10`:"—"} color={avgIns>=7?C.gr:avgIns>=5?C.am:C.re} sub={`${insList.length}টি পরিদর্শন`}/>
      <Stat label="ছাত্র ফিডব্যাক" value={fbList.length?`${avgFb}/5`:"—"} color={avgFb>=4?C.gr:avgFb>=3?C.am:C.re} sub={`${fbList.length}টি রেটিং`}/>
    </div>

    {/* ট্যাব বার */}
    <div style={{display:"flex",gap:4,overflowX:"auto",marginBottom:10,WebkitOverflowScrolling:"touch"}}>
      {[
        {id:"attendance",label:"📅 উপস্থিতি"},
        {id:"inspection",label:"🔍 পরিদর্শন"},
        {id:"syllabus",label:"📖 সিলেবাস"},
        {id:"training",label:"🎓 প্রশিক্ষণ"},
        {id:"feedback",label:"⭐ ফিডব্যাক"},
      ].map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"6px 10px",borderRadius:14,border:`1px solid ${tab===t.id?C.pu:C.bd}`,background:tab===t.id?C.puL:"transparent",color:tab===t.id?C.pu:C.mu,cursor:"pointer",fontSize:11,fontWeight:tab===t.id?700:400,whiteSpace:"nowrap",flexShrink:0}}>{t.label}</button>))}
    </div>

    {/* ── উপস্থিতি ট্যাব ── */}
    {tab==="attendance"&&(<div>
      <Card>
        <H3>📅 উপস্থিতি ও সময়ানুবর্তিতা</H3>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <button onClick={()=>addAttendance("present")} style={{padding:"8px 14px",borderRadius:8,border:"none",background:C.gr,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>✓ উপস্থিত</button>
          <button onClick={()=>addAttendance("late")} style={{padding:"8px 14px",borderRadius:8,border:"none",background:C.am,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>⏰ দেরিতে এসেছেন</button>
          <button onClick={()=>addAttendance("absent")} style={{padding:"8px 14px",borderRadius:8,border:"none",background:C.re,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>✗ অনুপস্থিত</button>
        </div>
        {/* প্রগ্রেস বার */}
        {totalDays>0&&(<div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
            <span style={{color:C.mu}}>উপস্থিতি হার</span>
            <span style={{fontWeight:700,color:attPct>=85?C.gr:attPct>=70?C.am:C.re}}>{attPct}%</span>
          </div>
          <div style={{height:8,background:"#eee",borderRadius:4}}>
            <div style={{width:`${attPct}%`,height:"100%",background:attPct>=85?C.gr:attPct>=70?C.am:C.re,borderRadius:4,transition:"width 0.4s"}}/>
          </div>
          <div style={{display:"flex",gap:12,marginTop:6,fontSize:11,color:C.mu}}>
            <span style={{color:C.gr}}>✓ উপস্থিত: {presentDays}</span>
            <span style={{color:C.am}}>⏰ দেরি: {lateCount}</span>
            <span style={{color:C.re}}>✗ অনুপস্থিত: {totalDays-presentDays-lateCount}</span>
          </div>
        </div>)}
        {/* লগ তালিকা */}
        {attList.length>0&&(<div>
          <div style={{fontSize:11,color:C.mu,marginBottom:6}}>সাম্প্রতিক রেকর্ড</div>
          {[...attList].reverse().slice(0,10).map((a,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.bd}`,fontSize:12}}>
              <span>{a.date}</span>
              {badge(a.status==="present"?C.gr:a.status==="late"?C.am:C.re, a.status==="present"?"উপস্থিত":a.status==="late"?"দেরিতে":"অনুপস্থিত")}
            </div>
          ))}
        </div>)}
        {attList.length===0&&<div style={{textAlign:"center",color:C.mu,padding:16,fontSize:13}}>এখনো কোনো উপস্থিতি রেকর্ড নেই</div>}
      </Card>
    </div>)}

    {/* ── পরিদর্শন ট্যাব ── */}
    {tab==="inspection"&&(<div>
      <Card>
        <H3>🔍 ক্লাস পরিদর্শন রিপোর্ট</H3>
        <InspectionForm onAdd={addInspection}/>
        {insList.length>0&&(<div style={{marginTop:12}}>
          {[...insList].reverse().map((ins,i)=>(
            <div key={i} style={{padding:"10px",background:C.bg,borderRadius:8,marginBottom:8,border:`1px solid ${C.bd}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontSize:12,color:C.mu}}>{ins.date}</span>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <div style={{fontSize:16,fontWeight:700,color:ins.score>=7?C.gr:ins.score>=5?C.am:C.re}}>{ins.score}/10</div>
                  {["⭐","⭐","⭐","⭐","⭐"].slice(0,Math.round(ins.score/2)).join("")}
                </div>
              </div>
              {ins.remarks&&<div style={{fontSize:12,color:C.tx,fontStyle:"italic"}}>"{ins.remarks}"</div>}
            </div>
          ))}
        </div>)}
        {insList.length===0&&<div style={{textAlign:"center",color:C.mu,padding:16,fontSize:13}}>এখনো কোনো পরিদর্শন রেকর্ড নেই</div>}
      </Card>
    </div>)}

    {/* ── সিলেবাস ট্যাব ── */}
    {tab==="syllabus"&&(<div>
      <Card>
        <H3>📖 সিলেবাস কভারেজ ট্র্যাকার</H3>
        <div style={{background:C.puL,borderRadius:8,padding:"8px 10px",marginBottom:10,fontSize:12,color:C.pu}}>
          💡 বাস্তবে কোন কোন টপিক পড়ানো হয়েছে তা টিক দিন — শুধু প্ল্যান জমা নয়
        </div>
        <SyllabusForm onAdd={addSyllabusTopic}/>
        {sylList.length>0&&(<div style={{marginTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:8}}>
            <span style={{color:C.mu}}>মোট টপিক: {totalTopics}</span>
            <span style={{fontWeight:700,color:sylPct>=75?C.gr:sylPct>=50?C.am:C.re}}>কভার: {sylPct}% ({coveredTopics}/{totalTopics})</span>
          </div>
          {["বাংলা","English","গণিত","বিজ্ঞান","সমাজ","ধর্ম","ICT"].map(sub=>{
            const subTopics=sylList.filter(s=>s.subject===sub);
            if(!subTopics.length)return null;
            const cov=subTopics.filter(s=>s.covered).length;
            return(<div key={sub} style={{marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:700,color:C.pu,marginBottom:4}}>{sub} ({cov}/{subTopics.length})</div>
              {subTopics.map((s,idx)=>{
                const realIdx=sylList.findIndex(x=>x===s);
                return(<div key={idx} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 6px",borderRadius:6,background:s.covered?C.grL:"#f8f7ff",marginBottom:3,cursor:"pointer"}} onClick={()=>toggleSyllabus(realIdx)}>
                  <span style={{fontSize:18,lineHeight:1}}>{s.covered?"✅":"⬜"}</span>
                  <span style={{fontSize:12,textDecoration:s.covered?"line-through":"none",color:s.covered?C.mu:C.tx}}>{s.topic}</span>
                </div>);

      </Card>

          <div style={{fontSize:12,color:C.mu,marginBottom:6}}>
            মোট ওয়ার্কশপ: {(obs.trainings||[]).length}টি •
            মোট ঘণ্টা: {(obs.trainings||[]).reduce((a,b)=>a+(b.hours||0),0)} ঘণ্টা
          </div>
          {[...(obs.trainings||[])].reverse().map((tr,i)=>(
            <div key={i} style={{padding:"9px 10px",background:C.teL,borderRadius:8,marginBottom:6,border:`1px solid ${C.te}20`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

            </div>

        {(obs.trainings||[]).length===0&&<div style={{textAlign:"center",color:C.mu,padding:16,fontSize:13}}>কোনো প্রশিক্ষণ রেকর্ড নেই</div>}
      </Card>
    </div>)}

    {tab==="feedback"&&(<div>
      <Card>
        <H3>⭐ ছাত্র ফিডব্যাক রেটিং</H3>
        <div style={{background:C.amL,borderRadius:8,padding:"8px 10px",marginBottom:10,fontSize:12,color:C.am}}>
          💡 বয়স অনুযায়ী সহজ রেটিং: ১ = খুব খারাপ, ২ = খারাপ, ৩ = মাঝামাঝি, ৪ = ভালো, ৫ = চমৎকার
        </div>
        <FeedbackForm onAdd={addFeedback}/>
        {fbList.length>0&&(<div style={{marginTop:12}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,padding:"8px 10px",background:C.bg,borderRadius:8}}>
            <div style={{fontSize:28,fontWeight:700,color:avgFb>=4?C.gr:avgFb>=3?C.am:C.re}}>{avgFb}</div>
            <div>
              <div style={{fontSize:16}}>{["","😢","😞","😐","😊","🤩"][Math.round(avgFb)]}</div>
              <div style={{fontSize:11,color:C.mu}}>গড় রেটিং ({fbList.length}টি মতামত)</div>
            </div>
          </div>

          {[5,4,3,2,1].map(star=>{
            const cnt=fbList.filter(f=>f.rating===star).length;
            const pct=fbList.length?Math.round(cnt/fbList.length*100):0;

              <span style={{fontSize:11,minWidth:16,color:C.mu,textAlign:"right"}}>{star}⭐</span>
              <div style={{flex:1,height:8,background:"#eee",borderRadius:4}}>
                <div style={{width:`${pct}%`,height:"100%",background:star>=4?C.gr:star===3?C.am:C.re,borderRadius:4,transition:"width 0.4s"}}/>
              </div>
              <span style={{fontSize:11,color:C.mu,minWidth:24}}>{cnt}</span>
            </div>);

                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
                  <span style={{color:C.mu}}>{fb.cls} শ্রেণি • {fb.date}</span>
                  <span style={{color:C.am,fontWeight:700}}>{"⭐".repeat(fb.rating)}</span>
                </div>
                {fb.comment&&<div style={{fontSize:12,color:C.tx,fontStyle:"italic"}}>"{fb.comment}"</div>}
              </div>
            ))}
          </div>
        </div>)}
        {fbList.length===0&&<div style={{textAlign:"center",color:C.mu,padding:16,fontSize:13}}>ছাত্রদের ফিডব্যাক এখনো যোগ হয়নি</div>}
      </Card>
    </div>)}
  </div>);
}

/* ফর্ম সাব-কম্পোনেন্ট */
function InspectionForm({onAdd}){
  const [score,setScore]=useState("7");
  const [remarks,setRemarks]=useState("");
  return(<div style={{background:C.bg,borderRadius:8,padding:10,marginBottom:8}}>
    <div style={{fontSize:12,color:C.mu,marginBottom:6}}>নতুন পরিদর্শন রেকর্ড</div>
    <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
      <div style={{flex:1}}>
        <div style={{fontSize:11,color:C.mu,marginBottom:3}}>স্কোর (১–১০)</div>
        <input type="number" min="1" max="10" value={score} onChange={e=>setScore(e.target.value)} style={{width:"100%"}}/>
      </div>
      <div style={{flex:2}}>
        <div style={{fontSize:11,color:C.mu,marginBottom:3}}>পর্যবেক্ষণ / মন্তব্য</div>
        <input type="text" placeholder="ক্লাস পরিচালনা, পদ্ধতি..." value={remarks} onChange={e=>setRemarks(e.target.value)} style={{width:"100%"}}/>
      </div>
    </div>
    <button onClick={()=>{if(score){onAdd(score,remarks);setScore("7");setRemarks("");}}} style={{width:"100%",padding:"7px",borderRadius:7,border:"none",background:C.pu,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>✓ পরিদর্শন যোগ করুন</button>

/* KPI গণনা ফাংশন — কেন্দ্রীয় */
function calcKPI(teacher, allRes, lessonPlans, obsData={}){
  const tr=allRes.filter(r=>r.teacher===teacher);
  // নতুন v2 ফরম্যাট থেকে approved plan গণনা
  const v2Plans=(lessonPlans._v2||[]).filter(p=>p.teacher===teacher&&p.status==="approved");
  // পুরনো ফরম্যাট (backward compat)
  const oldPlans=(lessonPlans[teacher]||[]);
  const lp=v2Plans.length+oldPlans.length;
  const obs=obsData[teacher]||{};

  // ছাত্রভিত্তিক গ্রুপ করা
  const studentMap={};
  tr.forEach(r=>{
    const key=`${r.name}__${r.subject}`;
    if(!studentMap[key])studentMap[key]=[];
    studentMap[key].push(r);
  });

  let improvementScore=0, weakStudentBonus=0, consistencyScore=0, entryCount=0;

  Object.values(studentMap).forEach(entries=>{
    if(entries.length<2)return;
    const sorted=[...entries].sort((a,b)=>(a.examOrder||1)-(b.examOrder||1));
    const first=sorted[0].marks, last=sorted[sorted.length-1].marks;
    const imp=last-first;

    // উন্নতি স্কোর (দুর্বল ছাত্রে বেশি ক্রেডিট)
    let baseImpScore=0;
    if(imp>0){
      if(first<33) baseImpScore=imp*2.5;
      else if(first<50) baseImpScore=imp*2.0;
      else if(first<70) baseImpScore=imp*1.2;
      else baseImpScore=imp*0.5;
    }
    improvementScore+=Math.min(100,baseImpScore);

    // দুর্বল ছাত্র বোনাস
    if(first<40 && imp>10) weakStudentBonus+=25;
    else if(first<33 && imp>0) weakStudentBonus+=15;

    // ধারাবাহিকতা স্কোর
    const avg=sorted.reduce((a,b)=>a+b.marks,0)/sorted.length;
    consistencyScore+=Math.min(100,avg);
    entryCount++;
  });

  // পর্যবেক্ষণ স্কোর
  const attList=obs.attendance||[];
  const presentDays=attList.filter(a=>a.status==="present").length;
  const lateCount=attList.filter(a=>a.status==="late").length;
  const totalDays=attList.length;
  const attScore=totalDays?Math.min(100,Math.round((presentDays+lateCount*0.5)/totalDays*100)):0;

  const insList=obs.inspections||[];
  const insScore=insList.length?Math.min(100,Math.round(insList.reduce((a,b)=>a+(b.score||0),0)/insList.length*10)):0;

  const sylList=obs.syllabus||[];
  const coveredTopics=sylList.filter(s=>s.covered).length;
  const totalTopics=sylList.length;
  const sylScore=totalTopics?Math.min(100,Math.round(coveredTopics/totalTopics*100)):0;

  const fbList=obs.feedback||[];
  const fbScore=fbList.length?Math.min(100,Math.round(fbList.reduce((a,b)=>a+(b.rating||0),0)/fbList.length*20)):0;

  const trainingList=obs.trainings||[];
  const trainingScore=Math.min(100,trainingList.length*20);

  const hasObsData=(attList.length+insList.length+sylList.length+fbList.length+trainingList.length)>0;

  if(entryCount===0&&lp===0&&!hasObsData)return{score:0,grade:"—",impScore:0,weakBonus:0,consScore:0,lpScore:0,attScore:0,insScore:0,sylScore:0,fbScore:0,trainingScore:0,count:tr.length,lp,breakdown:[]};

  const avgImp=entryCount?Math.min(100,Math.round(improvementScore/entryCount)):0;
  const avgWeak=entryCount?Math.min(100,Math.round(weakStudentBonus/entryCount)):0;
  const avgCons=entryCount?Math.min(100,Math.round(consistencyScore/entryCount)):0;
  const lpScore=Math.min(100,lp*10);

  // ওজনভিত্তিক চূড়ান্ত স্কোর (obs data যুক্ত হলে ওজন পুনর্বণ্টন)
  let finalScore;
  if(hasObsData){
    const obsAvg=Math.round((attScore+insScore+sylScore+fbScore+trainingScore)/5);
    finalScore=Math.min(100,Math.round(avgImp*0.30+avgWeak*0.20+avgCons*0.15+lpScore*0.05+obsAvg*0.30));
  } else {
    finalScore=Math.min(100,Math.round(avgImp*0.40+avgWeak*0.30+avgCons*0.20+lpScore*0.10));
  }

  const grade=finalScore>=85?"A+":finalScore>=70?"A":finalScore>=55?"B":finalScore>=40?"C":finalScore>0?"D":"—";

  const breakdown=[
    {label:"ছাত্র উন্নতি",value:avgImp,weight:hasObsData?30:40,color:C.gr},
    {label:"দুর্বল ছাত্র বোনাস",value:avgWeak,weight:hasObsData?20:30,color:C.co},
    {label:"ধারাবাহিকতা",value:avgCons,weight:hasObsData?15:20,color:C.te},
    {label:"পাঠ পরিকল্পনা",value:lpScore,weight:hasObsData?5:10,color:C.pu},
  ];
  if(hasObsData){
    breakdown.push({label:"উপস্থিতি",value:attScore,weight:6,color:C.am});
    breakdown.push({label:"পরিদর্শন স্কোর",value:insScore,weight:6,color:C.pu});
    breakdown.push({label:"সিলেবাস কভারেজ",value:sylScore,weight:6,color:C.te});
    breakdown.push({label:"ছাত্র ফিডব্যাক",value:fbScore,weight:6,color:C.gr});
    breakdown.push({label:"প্রশিক্ষণ",value:trainingScore,weight:6,color:C.co});
  }

  return{score:finalScore,grade,impScore:avgImp,weakBonus:avgWeak,consScore:avgCons,lpScore,
    attScore,insScore,sylScore,fbScore,trainingScore,hasObsData,
    count:tr.length,lp,breakdown};
}

function TeacherProfile({name,results,lessonPlans,obsData={},onClose}){
  const allRes=Object.values(results).flat();
  const tr=allRes.filter(r=>r.teacher===name);
  const lp=(lessonPlans._v2||[]).filter(p=>p.teacher===name&&p.status==="approved").length+(lessonPlans[name]||[]).length;

  // % ভিত্তিক গড়
  const avgPct=tr.length?Math.round(tr.reduce((a,b)=>a+(b.marks/(b.fullMarks||100)*100),0)/tr.length):0;
  const pass=tr.filter(r=>r.marks>=(r.passMarks||33)).length;
  const kpi=calcKPI(name,allRes,lessonPlans,obsData);
  const gc=kpi.grade==="A+"?C.gr:kpi.grade==="A"?C.te:kpi.grade==="B"?C.am:kpi.grade==="D"?C.co:C.mu;

  const obs=obsData[name]||{};
  const attList=obs.attendance||[];
  const presentDays=attList.filter(a=>a.status==="present").length;
  const lateCount=attList.filter(a=>a.status==="late").length;
  const totalDays=attList.length;
  const attPct=totalDays?Math.round((presentDays+lateCount*0.5)/totalDays*100):null;
  const sylList=obs.syllabus||[];
  const sylPct=sylList.length?Math.round(sylList.filter(s=>s.covered).length/sylList.length*100):null;
  const fbList=obs.feedback||[];
  const avgFb=fbList.length?Math.round(fbList.reduce((a,b)=>a+(b.rating||0),0)/fbList.length*10)/10:null;

  // বিষয়ভিত্তিক % গড়
  const subPerf=SUBJECTS.map(sub=>{
    const sr=tr.filter(r=>r.subject===sub);
    if(!sr.length)return null;
    const avgP=Math.round(sr.reduce((a,b)=>a+(b.marks/(b.fullMarks||100)*100),0)/sr.length);
    const sp=sr.filter(r=>r.marks>=(r.passMarks||33)).length;
    return{sub,avgP,sp,count:sr.length};
  }).filter(Boolean);

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:14,padding:18,width:"100%",maxWidth:420,maxHeight:"82vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>

        {/* হেডার */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:42,height:42,borderRadius:"50%",background:C.puL,color:C.pu,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14,flexShrink:0}}>
              {name.split(" ").map(w=>w[0]).filter(Boolean).slice(0,2).join("")}
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:15,color:C.pu}}>{name}</div>
              <div style={{fontSize:11,color:C.mu}}>Heritage Public School</div>
            </div>
          </div>
          <button onClick={onClose} style={{border:"none",background:C.puL,color:C.pu,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontWeight:700,fontSize:14}}>✕</button>
        </div>

        {/* KPI স্কোর */}
        <div style={{background:gc+"15",border:`1px solid ${gc}30`,borderRadius:10,padding:"12px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:11,color:C.mu}}>KPI স্কোর</div>
            <div style={{fontSize:28,fontWeight:700,color:gc}}>{kpi.score}</div>
            <div style={{fontSize:11,color:C.mu,marginTop:2}}>{kpi.grade==="—"?"ডেটা নেই":"গ্রেড: "+kpi.grade}</div>
          </div>
          <div style={{textAlign:"right"}}>
            {badge(gc,kpi.grade)}
            <div style={{fontSize:11,color:C.mu,marginTop:6}}>{tr.length}টি ফলাফল এন্ট্রি</div>
            <div style={{fontSize:11,color:C.mu}}>{lp}টি পাঠ পরিকল্পনা</div>
          </div>
        </div>

        {/* পর্যবেক্ষণ সারসংক্ষেপ */}
        {(attPct!==null||sylPct!==null||avgFb!==null)&&(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:12}}>
          {attPct!==null&&<Stat label="উপস্থিতি" value={`${attPct}%`} color={attPct>=85?C.gr:attPct>=70?C.am:C.re}/>}
          {sylPct!==null&&<Stat label="সিলেবাস" value={`${sylPct}%`} color={sylPct>=75?C.gr:sylPct>=50?C.am:C.re}/>}
          {avgFb!==null&&<Stat label="ফিডব্যাক" value={`${avgFb}/5`} color={avgFb>=4?C.gr:avgFb>=3?C.am:C.re}/>}
        </div>)}

        {/* পরিসংখ্যান */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
          <Stat label="গড় %" value={tr.length?`${avgPct}%`:"—"} color={C.te}/>
          <Stat label="পাস" value={tr.length?`${pass}/${tr.length}`:"—"} color={C.gr}/>
          <Stat label="ফেল" value={tr.length?tr.length-pass:"—"} color={tr.length-pass>0?C.re:C.mu}/>
        </div>

        {/* বিষয়ভিত্তিক পারফরম্যান্স */}
        {subPerf.length>0&&(
          <div>
            <H3>বিষয়ভিত্তিক পারফরম্যান্স</H3>
            <table>
              <thead><tr><th>বিষয়</th><th>গড় %</th><th>পাস</th><th>এন্ট্রি</th></tr></thead>
              <tbody>
                {subPerf.map(({sub,avgP,sp,count})=>{
                  const [,gc2]=getGrade(avgP,100,33);
                  return(<tr key={sub}>
                    <td style={{fontWeight:600,fontSize:12}}>{sub}</td>
                    <td style={{fontWeight:700,color:gc2}}>{avgP}%</td>
                    <td style={{color:C.gr,fontWeight:600}}>{sp}/{count}</td>
                    <td style={{color:C.mu,fontSize:12}}>{count}টি</td>
                  </tr>);

              </tbody>
            </table>
          </div>
        )}

        {tr.length===0&&(
          <div style={{textAlign:"center",color:C.mu,padding:20,fontSize:13}}>
            এখনো কোনো ফলাফল এন্ট্রি নেই<br/>
            <span style={{fontSize:11}}>পরীক্ষা মডিউলে এই শিক্ষককে নির্বাচন করুন</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ══ EXAM ENTRY ══ */
// তারিখ ফরম্যাট সাহায্যকারী
const toDisplayDate=(iso)=>{
  if(!iso)return"—";
  try{
    const d=new Date(iso);
    return d.toLocaleDateString("bn-BD",{day:"2-digit",month:"long",year:"numeric"});
  }catch(e){return iso;}
};
const todayISO=()=>new Date().toISOString().slice(0,10);

function ExamEntry({results,setResults}){
  const [cls,setCls]=useState("VI");
  const [sub,setSub]=useState((SUBJECTS_BY_CLASS["VI"]||SUBJECTS)[0]);
  const [ex,setEx]=useState("Half-Yearly Exam");
  const [marks,setMarks]=useState({});
  const [teacher,setTeacher]=useState(TEACHERS[0]);
  const [fullMarks,setFullMarks]=useState(100);
  const [passMarks,setPassMarks]=useState(33);
  const [examDate,setExamDate]=useState(todayISO()); // ✅ নতুন: পরীক্ষার তারিখ
  const [msg,setMsg]=useState("");
  const exList=["IV","V"].includes(cls)?EXAM_LOWER:EXAM_UPPER;
  const clsSubjects=SUBJECTS_BY_CLASS[cls]||SUBJECTS;

  // শ্রেণি পরিবর্তনে বিষয় রিসেট
  const handleClsChange=(c)=>{
    setCls(c);
    const subs=SUBJECTS_BY_CLASS[c]||SUBJECTS;
    setSub(subs[0]);
    setMarks({});
  };

  // পূর্ণ নম্বর পরিবর্তনে পাস নম্বর স্বয়ংক্রিয় আপডেট
  const handleFullMarks=(val)=>{
    const fm=parseInt(val)||100;
    setFullMarks(fm);
    setPassMarks(Math.round(fm*0.33));
  };

  // গ্রেড — পূর্ণ নম্বরের % অনুযায়ী
  const getDynGrade=(m,fm)=>{
    const pct=m/fm*100;
    if(pct>=80)return["A+",C.gr];if(pct>=70)return["A",C.te];if(pct>=60)return["A-",C.te];
    if(pct>=50)return["B",C.am];if(pct>=40)return["C",C.am];
    if(m>=passMarks)return["D",C.co];return["F",C.re];
  };

  // লাইভ প্রিভিউ
  const entered=Object.values(marks).filter(v=>v!=="");
  const liveAvg=entered.length?Math.round(entered.reduce((a,b)=>a+parseInt(b),0)/entered.length):null;
  const livePass=entered.filter(v=>parseInt(v)>=passMarks).length;
  const liveFail=entered.filter(v=>parseInt(v)<passMarks).length;
  const liveAvgPct=liveAvg?Math.round(liveAvg/fullMarks*100):null;

  const save=()=>{
    if(!examDate){setMsg("⚠ পরীক্ষার তারিখ দিন");setTimeout(()=>setMsg(""),2500);return;}
    const entries=STUDENTS[cls].map(name=>({
      name,cls,subject:sub,examType:ex,
      marks:parseInt(marks[name]||0),
      fullMarks,passMarks,
      examOrder:EXAM_ORDER[ex]||1,
      teacher,
      examDate, // ✅ নতুন ফিল্ড
    }));
    setResults(p=>({...p,[cls]:[...(p[cls]||[]),...entries]}));
    setMarks({});
    setMsg("✓ সফলভাবে সংরক্ষিত!");
    setTimeout(()=>setMsg(""),2500);
  };

  return(<div>
    <H2>📝 পরীক্ষার নম্বর এন্ট্রি</H2>
    <Card>

      {filtered.slice().reverse().map((r,i)=>{const[g,gc]=getGrade(r.marks, r.fullMarks||100, r.passMarks||33);return(<tr key={i}><td style={{fontWeight:500,fontSize:11,color:C.pu,textDecoration:"underline dotted",cursor:"pointer"}} onClick={()=>setSelProfile({name:r.name,cls:r.cls})}>{r.name}</td><td>{badge(C.te,r.cls)}</td><td style={{fontSize:11}}>{r.subject}</td><td style={{fontSize:10,color:C.mu}}>{r.examType}</td><td style={{fontSize:10,color:C.am,fontWeight:600,whiteSpace:"nowrap"}}>{r.examDate?toDisplayDate(r.examDate):"—"}</td><td style={{fontWeight:700,color:gc}}>{r.marks}</td><td>{badge(gc,g)}</td></tr>);})}
      {filtered.length===0&&<tr><td colSpan={7} style={{textAlign:"center",color:C.mu,padding:20}}>ফলাফল নেই</td></tr>}
    </tbody></table></div></Card>)}
  </div>);
}

/* ══ LESSON PLAN SYSTEM v2 — INTERNATIONAL STANDARD ══ */

/*
  ভূমিকা বিন্যাস:
  TEACHER  → লেসন প্ল্যান জমা দেন (Draft)
  ACADEMIC → একাডেমিক ইনচার্জ — Approve / Reject / Request Revision

  লেসন প্ল্যান একটি অবজেক্ট:
  { id, teacher, cls, subject, week, date,
    topic, objectives, methodology, materials, activities,
    assessment, homework, reflection,
    status: "pending"|"approved"|"rejected"|"revision",
    adminNote, submittedAt, reviewedAt }
*/

const LP_ROLES={TEACHER:"teacher",ADMIN:"admin"};
const LP_STATUS={PENDING:"pending",APPROVED:"approved",REJECTED:"rejected",REVISION:"revision"};

// লেসন প্ল্যান ফর্ম — শিক্ষকের জন্য
function LPSubmitForm({currentUser,onSubmit,onCancel,initial=null}){
  const today=new Date().toLocaleDateString("bn-BD");
  const [teacher,setTeacher]=useState(initial?.teacher||currentUser||TEACHERS[0]);
  const [cls,setCls]=useState(initial?.cls||"VI");
  const [sub,setSub]=useState(initial?.subject||(SUBJECTS_BY_CLASS["VI"]||SUBJECTS)[0]);

  const handleClsChange=(c)=>{
    setCls(c);
    setSub((SUBJECTS_BY_CLASS[c]||SUBJECTS)[0]);
  };
  const clsSubjects=SUBJECTS_BY_CLASS[cls]||SUBJECTS;
  const [week,setWeek]=useState(initial?.week||"");
  const [topic,setTopic]=useState(initial?.topic||"");
  const [objectives,setObjectives]=useState(initial?.objectives||"");
  const [methodology,setMethodology]=useState(initial?.methodology||"");
  const [materials,setMaterials]=useState(initial?.materials||"");
  const [activities,setActivities]=useState(initial?.activities||"");
  const [assessment,setAssessment]=useState(initial?.assessment||"");
  const [homework,setHomework]=useState(initial?.homework||"");
  const [reflection,setReflection]=useState(initial?.reflection||"");
  const [err,setErr]=useState("");

  const isAdmin=(currentUser==="ADMIN");
  const selTeacher=isAdmin?teacher:currentUser;

  const validate=()=>{
    if(!topic.trim())return"পাঠের শিরোনাম আবশ্যক";
    if(!week.trim())return"সপ্তাহ/তারিখ আবশ্যক";
    if(!objectives.trim())return"শিক্ষার উদ্দেশ্য আবশ্যক";
    if(!methodology.trim())return"শিক্ষণ পদ্ধতি আবশ্যক";
    if(!activities.trim())return"পাঠ কার্যক্রম আবশ্যক";
    if(!assessment.trim())return"মূল্যায়ন পদ্ধতি আবশ্যক";
    return null;
  };

  const submit=()=>{
    const e=validate();
    if(e){setErr(e);return;}
    setErr("");
    onSubmit({
      id:initial?.id||Date.now().toString(),
      teacher:selTeacher,cls,subject:sub,week,topic,
      objectives,methodology,materials,activities,
      assessment,homework,reflection,
      status:LP_STATUS.PENDING,
      adminNote:"",
      submittedAt:new Date().toISOString(),
      reviewedAt:null
    });
  };

  const FLabel=({children,req})=><div style={{fontSize:11,color:C.mu,marginBottom:3}}>{children}{req&&<span style={{color:C.re}}> *</span>}</div>;
  const TA=({val,onChange,placeholder,rows=2})=>(
    <textarea value={val} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
      style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13,fontFamily:"sans-serif",resize:"vertical",outline:"none",boxSizing:"border-box"}}/>
  );

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:500,overflowY:"auto",padding:"16px 12px"}}>
      <div style={{background:"#fff",borderRadius:16,padding:18,maxWidth:560,margin:"0 auto",boxShadow:"0 8px 32px rgba(83,68,181,0.18)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div>
            <div style={{fontWeight:700,fontSize:16,color:C.pu}}>📋 লেসন প্ল্যান ফর্ম</div>
            <div style={{fontSize:11,color:C.mu,marginTop:2}}>Heritage Public School • আন্তর্জাতিক মানের পাঠ পরিকল্পনা</div>
          </div>
          <button onClick={onCancel} style={{border:"none",background:C.reL,color:C.re,borderRadius:8,padding:"5px 11px",cursor:"pointer",fontWeight:700,fontSize:14}}>✕</button>
        </div>

        {/* ── সেকশন ১: পরিচিতি ── */}
        <div style={{background:C.puL,borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.pu}25`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.pu,marginBottom:10}}>① মূল তথ্য</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            {isAdmin?(
              <div><FLabel req>শিক্ষক</FLabel>
                <select value={teacher} onChange={e=>setTeacher(e.target.value)} style={{width:"100%",padding:"8px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13}}>
                  {TEACHERS.map(t=><option key={t}>{t}</option>)}
                </select>
              </div>
            ):(
              <div><FLabel>শিক্ষক</FLabel>
                <div style={{padding:"8px 10px",background:"#f5f5f5",borderRadius:8,fontSize:13,fontWeight:600,color:C.pu}}>{currentUser}</div>
              </div>
            )}
            <div><FLabel req>শ্রেণি</FLabel>
              <select value={cls} onChange={e=>handleClsChange(e.target.value)} style={{width:"100%",padding:"8px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13}}>
                {Object.keys(STUDENTS).map(c=><option key={c} value={c}>শ্রেণি {c}</option>)}
              </select>
            </div>
            <div><FLabel req>বিষয়</FLabel>
              <select value={sub} onChange={e=>setSub(e.target.value)} style={{width:"100%",padding:"8px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13}}>
                {clsSubjects.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            <div><FLabel req>সপ্তাহ / তারিখ</FLabel>
              <input type="text" placeholder="যেমন: সপ্তাহ-১৫, ১৬ জুন" value={week} onChange={e=>setWeek(e.target.value)}
                style={{width:"100%",padding:"8px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13}}/>
            </div>
          </div>
          <div><FLabel req>পাঠের শিরোনাম / টপিক</FLabel>
            <input type="text" placeholder="পাঠের মূল বিষয়বস্তু লিখুন..." value={topic} onChange={e=>setTopic(e.target.value)}
              style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13}}/>
          </div>
        </div>

        {/* ── সেকশন ২: শিক্ষার উদ্দেশ্য ── */}
        <div style={{background:"#f0fff4",borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.gr}25`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.gr,marginBottom:10}}>② শিক্ষার উদ্দেশ্য (Learning Objectives)</div>
          <FLabel req>পাঠ শেষে শিক্ষার্থীরা কী জানবে / পারবে?</FLabel>
          <TA val={objectives} onChange={setObjectives} placeholder="১. ... ২. ... ৩. ... (Bloom's Taxonomy অনুসরণ করুন)" rows={3}/>
        </div>

        {/* ── সেকশন ৩: পদ্ধতি ── */}
        <div style={{background:"#fff8e1",borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.am}25`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.am,marginBottom:10}}>③ শিক্ষণ পদ্ধতি ও উপকরণ</div>
          <div style={{marginBottom:8}}>
            <FLabel req>শিক্ষণ পদ্ধতি (Teaching Method)</FLabel>
            <TA val={methodology} onChange={setMethodology} placeholder="যেমন: প্রশ্নোত্তর, গ্রুপ আলোচনা, প্রদর্শনী পদ্ধতি..."/>
          </div>
          <div>
            <FLabel>শিক্ষা উপকরণ (Materials)</FLabel>
            <TA val={materials} onChange={setMaterials} placeholder="যেমন: বোর্ড, চার্ট, মডেল, ডিজিটাল কন্টেন্ট..."/>
          </div>
        </div>

        {/* ── সেকশন ৪: কার্যক্রম ── */}
        <div style={{background:"#f3eeff",borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.pu}20`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.pu,marginBottom:10}}>④ পাঠ কার্যক্রম (Lesson Activities)</div>
          <FLabel req>সময়ভিত্তিক কার্যক্রমের বিবরণ</FLabel>
          <TA val={activities} onChange={setActivities} rows={4}
            placeholder={`ভূমিকা (৫ মি.): ...\nমূল পাঠ (৩০ মি.): ...\nঅনুশীলন (১০ মি.): ...\nসমাপ্তি (৫ মি.): ...`}/>
        </div>

        {/* ── সেকশন ৫: মূল্যায়ন ও গৃহকাজ ── */}
        <div style={{background:"#faf0f0",borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.co}25`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.co,marginBottom:10}}>⑤ মূল্যায়ন ও গৃহকাজ</div>
          <div style={{marginBottom:8}}>
            <FLabel req>মূল্যায়ন পদ্ধতি (Assessment)</FLabel>
            <TA val={assessment} onChange={setAssessment} placeholder="যেমন: মৌখিক প্রশ্ন, কুইজ, পর্যবেক্ষণ, লিখিত উত্তর..."/>
          </div>
          <div>
            <FLabel>গৃহকাজ / অনুশীলন (Homework)</FLabel>
            <TA val={homework} onChange={setHomework} placeholder="পরবর্তী ক্লাসের আগে শিক্ষার্থীরা কী করবে..."/>
          </div>
        </div>

        {/* ── সেকশন ৬: প্রতিফলন ── */}
        <div style={{background:"#e8f5e9",borderRadius:10,padding:"12px",marginBottom:14,border:`1px solid ${C.gr}20`}}>
          <div style={{fontWeight:700,fontSize:12,color:C.te,marginBottom:10}}>⑥ পাঠ প্রতিফলন (Self-Reflection)</div>
          <FLabel>পাঠ দেওয়ার পরের অনুভূতি ও উন্নতির পরিকল্পনা</FLabel>
          <TA val={reflection} onChange={setReflection} placeholder="কী ভালো হয়েছে? কোথায় উন্নতি দরকার? পরের বার কীভাবে ভালো করব?"/>
        </div>

        {err&&<div style={{background:C.reL,border:`1px solid ${C.re}40`,borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:13,color:C.re,fontWeight:600}}>⚠ {err}</div>}

        <div style={{display:"flex",gap:10}}>
          <button onClick={submit} style={{flex:1,padding:"11px",borderRadius:10,border:"none",background:C.pu,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:14}}>
            📤 জমা দিন (Submit)
          </button>
          <button onClick={onCancel} style={{padding:"11px 16px",borderRadius:10,border:`1px solid ${C.bd}`,background:"transparent",cursor:"pointer",color:C.mu,fontSize:13}}>বাতিল</button>
        </div>
      </div>
    </div>
  );
}

// লেসন প্ল্যান রিভিউ — একাডেমিক ইনচার্জের জন্য
function LPReviewModal({plan,onApprove,onReject,onRevision,onClose}){
  const [note,setNote]=useState(plan.adminNote||"");
  const [action,setAction]=useState(null);

  const statusColor={pending:C.am,approved:C.gr,rejected:C.re,revision:C.co};
  const statusLabel={pending:"অপেক্ষমান",approved:"অনুমোদিত",rejected:"প্রত্যাখ্যাত",revision:"সংশোধন প্রয়োজন"};

  const Section=({emoji,title,content,color})=>content?(
    <div style={{marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,color,marginBottom:4}}>{emoji} {title}</div>
      <div style={{fontSize:13,color:C.tx,background:"#f9f9fb",borderRadius:7,padding:"8px 10px",whiteSpace:"pre-wrap",lineHeight:1.6}}>{content}</div>
    </div>
  ):null;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:600,overflowY:"auto",padding:"16px 12px"}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,padding:18,maxWidth:580,margin:"0 auto",boxShadow:"0 8px 40px rgba(0,0,0,0.2)"}} onClick={e=>e.stopPropagation()}>

        {/* হেডার */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:C.pu}}>{plan.topic}</div>
            <div style={{fontSize:12,color:C.mu,marginTop:2}}>
              {plan.teacher.split(" ").slice(-1)[0]} • শ্রেণি {plan.cls} • {plan.subject} • {plan.week}
            </div>
            <div style={{marginTop:6}}>
              {badge(statusColor[plan.status]||C.mu, statusLabel[plan.status]||plan.status)}
            </div>
          </div>
          <button onClick={onClose} style={{border:"none",background:C.puL,color:C.pu,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontWeight:700}}>✕</button>
        </div>

        <div style={{height:1,background:C.bd,marginBottom:14}}/>

        {/* বিষয়বস্তু */}
        <Section emoji="🎯" title="শিক্ষার উদ্দেশ্য" content={plan.objectives} color={C.gr}/>
        <Section emoji="📖" title="শিক্ষণ পদ্ধতি" content={plan.methodology} color={C.am}/>
        <Section emoji="🛠" title="উপকরণ" content={plan.materials} color={C.am}/>
        <Section emoji="📋" title="পাঠ কার্যক্রম" content={plan.activities} color={C.pu}/>
        <Section emoji="✅" title="মূল্যায়ন পদ্ধতি" content={plan.assessment} color={C.co}/>
        <Section emoji="🏠" title="গৃহকাজ" content={plan.homework} color={C.te}/>
        <Section emoji="💭" title="পাঠ প্রতিফলন" content={plan.reflection} color={C.te}/>

        {/* পূর্ববর্তী মন্তব্য */}
        {plan.adminNote&&plan.status!==LP_STATUS.PENDING&&(
          <div style={{background:C.amL,border:`1px solid ${C.am}40`,borderRadius:8,padding:"8px 10px",marginBottom:12,fontSize:12,color:C.am}}>
            <span style={{fontWeight:700}}>📝 পূর্ববর্তী মন্তব্য: </span>{plan.adminNote}
          </div>
        )}

        {/* অ্যাডমিন অ্যাকশন প্যানেল */}
        <div style={{background:C.puL,borderRadius:10,padding:12,border:`1px solid ${C.pu}25`}}>
          <div style={{fontSize:12,fontWeight:700,color:C.pu,marginBottom:8}}>🔑 একাডেমিক ইনচার্জ মন্তব্য ও সিদ্ধান্ত</div>
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2}
            placeholder="মন্তব্য লিখুন (অনুমোদন/প্রত্যাখ্যানের কারণ)..."
            style={{width:"100%",padding:"8px 10px",border:`1px solid ${C.bd}`,borderRadius:8,fontSize:13,fontFamily:"sans-serif",resize:"vertical",outline:"none",marginBottom:10,boxSizing:"border-box"}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
            <button onClick={()=>{if(!action){setAction("approve");onApprove(plan.id,note);}}}
              style={{padding:"9px 6px",borderRadius:8,border:"none",background:C.gr,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>
              ✅ অনুমোদন
            </button>
            <button onClick={()=>{if(!action){setAction("revision");onRevision(plan.id,note);}}}
              style={{padding:"9px 6px",borderRadius:8,border:"none",background:C.am,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>
              🔄 সংশোধন
            </button>
            <button onClick={()=>{if(!action){setAction("reject");onReject(plan.id,note);}}}
              style={{padding:"9px 6px",borderRadius:8,border:"none",background:C.re,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>
              ✗ প্রত্যাখ্যান
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// মূল LessonPlans কম্পোনেন্ট
function LessonPlans({lessonPlans,setLessonPlans,lpRole,setLpRole}){
  const [showForm,setShowForm]=useState(false);
  const [viewPlan,setViewPlan]=useState(null);
  const [reviewPlan,setReviewPlan]=useState(null);
  const [filterStatus,setFilterStatus]=useState("সব");
  const [filterTeacher,setFilterTeacher]=useState("সব");
  const [filterCls,setFilterCls]=useState("সব");
  const [msg,setMsg]=useState(null);// {text,type}

  const isAdmin=(lpRole===LP_ROLES.ADMIN);
  const currentTeacher=isAdmin?null:lpRole;// teacher name string or null

  // সব প্ল্যান flat array — নতুন ফরম্যাট
  const allPlans=useMemo(()=>{
    if(!lessonPlans._v2)return[];
    return lessonPlans._v2||[];
  },[lessonPlans]);

  const flash=(text,type="success")=>{setMsg({text,type});setTimeout(()=>setMsg(null),3000);};

  // জমা দেওয়া
  const handleSubmit=(plan)=>{
    setLessonPlans(prev=>({...prev,_v2:[...(prev._v2||[]),plan]}));
    setShowForm(false);
    flash("✓ লেসন প্ল্যান সফলভাবে জমা দেওয়া হয়েছে! একাডেমিক ইনচার্জের অনুমোদনের জন্য অপেক্ষা করুন।");
  };

  // একাডেমিক ইনচার্জের অ্যাকশন
  const doAction=(id,status,note)=>{
    setLessonPlans(prev=>({...prev,_v2:(prev._v2||[]).map(p=>p.id===id?{...p,status,adminNote:note,reviewedAt:new Date().toISOString()}:p)}));
    setReviewPlan(null);
    const msgs={approved:"✅ লেসন প্ল্যান অনুমোদন করা হয়েছে।",rejected:"✗ লেসন প্ল্যান প্রত্যাখ্যাত হয়েছে।",revision:"🔄 সংশোধনের জন্য ফেরত দেওয়া হয়েছে।"};
    flash(msgs[status]||"সম্পন্ন",status==="approved"?"success":status==="rejected"?"error":"warning");
  };

  // ফিল্টার
  const filtered=useMemo(()=>{
    let list=allPlans;
    if(!isAdmin)list=list.filter(p=>p.teacher===currentTeacher);
    if(filterStatus!=="সব")list=list.filter(p=>p.status===filterStatus);
    if(filterTeacher!=="সব")list=list.filter(p=>p.teacher===filterTeacher);
    if(filterCls!=="সব")list=list.filter(p=>p.cls===filterCls);
    return[...list].reverse();

  // পরিসংখ্যান
  const stats=useMemo(()=>({
    total:isAdmin?allPlans.length:allPlans.filter(p=>p.teacher===currentTeacher).length,
    pending:allPlans.filter(p=>p.status===LP_STATUS.PENDING&&(!isAdmin?p.teacher===currentTeacher:true)).length,
    approved:allPlans.filter(p=>p.status===LP_STATUS.APPROVED&&(!isAdmin?p.teacher===currentTeacher:true)).length,
    rejected:allPlans.filter(p=>p.status===LP_STATUS.REJECTED&&(!isAdmin?p.teacher===currentTeacher:true)).length,
    revision:allPlans.filter(p=>p.status===LP_STATUS.REVISION&&(!isAdmin?p.teacher===currentTeacher:true)).length,
  }),[allPlans,isAdmin,currentTeacher]);

  const statusColor={pending:C.am,approved:C.gr,rejected:C.re,revision:C.co};
  const statusLabel={pending:"অপেক্ষমান",approved:"অনুমোদিত",rejected:"প্রত্যাখ্যাত",revision:"সংশোধন প্রয়োজন"};
  const statusIcon={pending:"⏳",approved:"✅",rejected:"✗",revision:"🔄"};

  return(<div>
    {/* ফর্ম মোডাল */}
    {showForm&&(
      <LPSubmitForm
        currentUser={isAdmin?"ADMIN":currentTeacher}
        onSubmit={handleSubmit}
        onCancel={()=>setShowForm(false)}/>
    )}

    {/* রিভিউ মোডাল — শুধু অ্যাডমিন */}
    {reviewPlan&&isAdmin&&(
      <LPReviewModal
        plan={reviewPlan}
        onApprove={(id,note)=>doAction(id,LP_STATUS.APPROVED,note)}
        onReject={(id,note)=>doAction(id,LP_STATUS.REJECTED,note)}
        onRevision={(id,note)=>doAction(id,LP_STATUS.REVISION,note)}

    {msg&&(
      <div style={{background:msg.type==="success"?C.grL:msg.type==="error"?C.reL:C.amL,border:`1px solid ${msg.type==="success"?C.gr:msg.type==="error"?C.re:C.am}40`,borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:13,fontWeight:600,color:msg.type==="success"?C.gr:msg.type==="error"?C.re:C.am}}>

    {/* রোল সুইচার */}

      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button onClick={()=>setLpRole(LP_ROLES.ADMIN)}
          style={{padding:"6px 12px",borderRadius:20,border:`1px solid ${isAdmin?C.pu:C.bd}`,background:isAdmin?C.pu:"transparent",color:isAdmin?"#fff":C.mu,cursor:"pointer",fontWeight:isAdmin?700:400,fontSize:12}}>
          🏫 একাডেমিক ইনচার্জ
        </button>
        {TEACHERS.map(t=>(
          <button key={t} onClick={()=>setLpRole(t)}
            style={{padding:"6px 10px",borderRadius:20,border:`1px solid ${lpRole===t?C.te:C.bd}`,background:lpRole===t?C.te:"transparent",color:lpRole===t?"#fff":C.mu,cursor:"pointer",fontWeight:lpRole===t?700:400,fontSize:11,whiteSpace:"nowrap"}}>
            {t.split(" ").pop()}

          :`👤 আপনি ${lpRole} হিসেবে লেসন প্ল্যান জমা দিতে ও নিজের প্ল্যানের অবস্থা দেখতে পারবেন।`}
      </div>
    </Card>

    {/* পরিসংখ্যান */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:12}}>

    {/* অ্যাকশন বার */}
    <Card style={{padding:"10px 12px",marginBottom:12}}>

            </button>
          </div>
        ))}

    )}

    {/* সম্পূর্ণ তালিকা */}
    <Card>
      <H3>পাঠ পরিকল্পনা তালিকা ({filtered.length}টি)</H3>
      {filtered.length===0?(
        <div style={{textAlign:"center",color:C.mu,padding:28,fontSize:13}}>
          {isAdmin?"কোনো লেসন প্ল্যান জমা পড়েনি।":"আপনি এখনো কোনো লেসন প্ল্যান জমা দেননি।"}<br/>
          <span style={{fontSize:11}}>{!isAdmin&&"উপরের বোতামে ক্লিক করে প্রথম লেসন প্ল্যান জমা দিন।"}</span>

            return(
              <div key={p.id} style={{borderRadius:10,border:`1px solid ${isPending&&isAdmin?C.am+"80":C.bd}`,background:isPending&&isAdmin?C.amL:"#fff",padding:"10px 12px",marginBottom:8,cursor:"pointer",transition:"box-shadow 0.2s"}}

                      {isAdmin&&<span style={{fontWeight:600,color:C.pu}}>{p.teacher.split(" ").slice(-1)[0]} • </span>}

                    {p.adminNote&&p.status!==LP_STATUS.PENDING&&(
                      <div style={{fontSize:11,color:sc,marginTop:4,fontStyle:"italic"}}>💬 "{p.adminNote}"</div>
                    )}
                  </div>

                    {badge(sc,`${si} ${sl}`)}

                      <div style={{fontSize:10,color:C.am,fontWeight:700,marginTop:4}}>ক্লিক → রিভিউ</div>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </Card>

    {/* শিক্ষকভিত্তিক সারসংখ্যা — শুধু অ্যাডমিন */}
    {isAdmin&&allPlans.length>0&&(
      <Card>
        <H3>শিক্ষকভিত্তিক সারসংখ্যা</H3>
        {TEACHERS.map(t=>{
          const tp=allPlans.filter(p=>p.teacher===t);
          if(!tp.length)return null;
          const tApproved=tp.filter(p=>p.status===LP_STATUS.APPROVED).length;
          const tPending=tp.filter(p=>p.status===LP_STATUS.PENDING).length;
          const rate=Math.round(tApproved/tp.length*100);
          return(
            <div key={t} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:`1px solid ${C.bd}`}}>

                  <span style={{fontSize:10,color:C.gr}}>✅ {tApproved}</span>
                  {tPending>0&&<span style={{fontSize:10,color:C.am}}>⏳ {tPending}</span>}
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:13,fontWeight:700,color:rate>=80?C.gr:rate>=50?C.am:C.re}}>{rate}%</div>
                <div style={{fontSize:10,color:C.mu}}>অনুমোদন হার</div>
              </div>
            </div>
          );
        }).filter(Boolean)}
      </Card>
    )}
  </div>);
}

function KPI({results,lessonPlans,obsData={}}){
  const [tab,setTab]=useState("ranking");

  const [selProfile,setSelProfile]=useState(null);
  const allRes=Object.values(results).flat();

  // সব শিক্ষকের KPI গণনা
  const kpiAll=useMemo(()=>
    TEACHERS.map(teacher=>({teacher,...calcKPI(teacher,allRes,lessonPlans,obsData)}))
      .sort((a,b)=>b.score-a.score)
  ,[allRes,lessonPlans,obsData]);

  const gradeColor=g=>g==="A+"?C.gr:g==="A"?C.te:g==="B"?C.am:g==="C"||g==="D"?C.co:C.mu;

  // নির্বাচিত শিক্ষকের বিস্তারিত তথ্য
  const detail=selTeacher?kpiAll.find(k=>k.teacher===selTeacher):null;
  const detailRes=selTeacher?allRes.filter(r=>r.teacher===selTeacher):[];

  // নির্বাচিত শিক্ষকের ছাত্রভিত্তিক উন্নতি
  const studentImprovements=useMemo(()=>{
    if(!selTeacher)return[];
    const map={};
    detailRes.forEach(r=>{
      const key=`${r.name}__${r.subject}`;
      if(!map[key])map[key]=[];
      map[key].push(r);
    });
    return Object.values(map).filter(e=>e.length>=2).map(entries=>{
      const sorted=[...entries].sort((a,b)=>(a.examOrder||1)-(b.examOrder||1));
      const first=sorted[0].marks,last=sorted[sorted.length-1].marks,imp=last-first;
      return{name:sorted[0].name,subject:sorted[0].subject,first,last,imp};
    }).sort((a,b)=>b.imp-a.imp);
  },[selTeacher,detailRes]);

  const subjectPerf=useMemo(()=>{
    if(!selTeacher)return[];
    return SUBJECTS.map(sub=>{
      const sr=detailRes.filter(r=>r.subject===sub);
      if(!sr.length)return null;
      const avg=Math.round(sr.reduce((a,b)=>a+b.marks,0)/sr.length);
      const pass=sr.filter(r=>r.marks>=(r.passMarks||33)).length;
      return{sub,avg,pass,fail:sr.length-pass,count:sr.length};
    }).filter(Boolean);
  },[selTeacher,detailRes]);

  const tabs=[{id:"ranking",label:"🏆 র‍্যাংকিং"},{id:"scorecard",label:"📊 স্কোরকার্ড"},{id:"detail",label:"🔍 বিস্তারিত"}];

  return(<div>
    <H2>⭐ শিক্ষক KPI সিস্টেম</H2>

    {/* KPI নিয়মের ব্যাখ্যা */}
    <Card style={{background:"linear-gradient(135deg,#5344b515,#0f6e5615)",border:`1px solid ${C.pu}30`}}>
      <H3 style={{color:C.pu}}>KPI গণনার পদ্ধতি</H3>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["🎯 ছাত্র উন্নতি","৩০%","দুর্বল ছাত্রের উন্নতিতে বেশি ক্রেডিট",C.gr],["💪 দুর্বল ছাত্র বোনাস","২০%","ফেল→পাস = সর্বোচ্চ পুরস্কার",C.co],["📈 ধারাবাহিকতা","১৫%","গড় নম্বর বজায় রাখা",C.te],["📚 পাঠ পরিকল্পনা","৫%","নিয়মিত পাঠ সাবমিট",C.pu],["📅 উপস্থিতি","৬%","সময়মতো উপস্থিতি",C.am],["🔍 পরিদর্শন","৬%","ক্লাস পর্যবেক্ষণ স্কোর",C.pu],["📖 সিলেবাস","৬%","বাস্তব কভারেজ হার",C.te],["⭐ ফিডব্যাক","৬%","ছাত্রদের রেটিং",C.gr],["🎓 প্রশিক্ষণ","৬%","ওয়ার্কশপ অংশগ্রহণ",C.co]].map(([t,w,d,c])=>(
          <div key={t} style={{background:c+"12",border:`1px solid ${c}25`,borderRadius:8,padding:"8px 10px"}}>

      <div style={{marginTop:10,padding:"7px 10px",background:C.reL,borderRadius:7,border:`1px solid ${C.re}30`}}>

        <span style={{fontSize:12}}>পর্যবেক্ষণ ডেটা না থাকলে পুরনো ৪-মেট্রিক পদ্ধতিতে হিসাব হবে</span>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>

      <Card>
        <H3>শিক্ষক KPI র‍্যাংকিং</H3>

        <table>
          <thead><tr><th>র‍্যাংক</th><th>শিক্ষক</th><th>স্কোর</th><th>গ্রেড</th></tr></thead>

    {/* ── বিস্তারিত ট্যাব ── */}
    {tab==="detail"&&(<div>
      <Card style={{padding:"10px 12px",marginBottom:10}}>
        <div style={{fontSize:12,color:C.mu,marginBottom:5}}>শিক্ষক নির্বাচন</div>
        <select value={selTeacher} onChange={e=>setSelTeacher(e.target.value)} style={{width:"100%"}}>
          <option value="">-- শিক্ষক বেছে নিন --</option>
          {TEACHERS.map(t=><option key={t} value={t}>{t}</option>)}

      </Card>

      {detail&&(<div>
        {/* শিক্ষকের সারসংক্ষেপ */}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>{selTeacher}</div>
              <div style={{fontSize:12,color:C.mu,marginTop:2}}>{detail.count}টি ফলাফল এন্ট্রি • {detail.lp}টি পাঠ পরিকল্পনা</div>

            <div style={{textAlign:"center"}}>
              <div style={{fontSize:32,fontWeight:700,color:gradeColor(detail.grade)}}>{detail.score}</div>
